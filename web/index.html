<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Trening</title>
<meta name="theme-color" content="#0f1612" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#edf4f2" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Czcionki lokalne (OFL, web/fonts/), też offline przez sw.js. Zakresy: łaciński + rozszerzony (polskie znaki). */
  @font-face{font-family:"Big Shoulders Display";font-weight:100 900;font-display:swap;src:url(fonts/big-shoulders-display-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"Big Shoulders Display";font-weight:100 900;font-display:swap;src:url(fonts/big-shoulders-display-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"Instrument Sans";font-weight:400 700;font-display:swap;src:url(fonts/instrument-sans-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"Instrument Sans";font-weight:400 700;font-display:swap;src:url(fonts/instrument-sans-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  /* Tokeny Pomost (docs/ui-v2-spec.md, „Paleta”). Kolory tylko przez te zmienne. */
  :root{--bg:#edf4f2;--surface:#ffffff;--surface-2:#e1eae6;--line:#c9d4cf;
        --ink:#17221c;--ink-2:#31473a;--muted:#5f6649;--olive:#7c8363;
        --primary:#31473a;--on-primary:#ffffff;--accent:#a9542a;--on-accent:#ffffff;
        --ok:#296c45;--warn:#8f5d0e;--bad:#b5483b;
        --panel:#17221c;--light-off:#38443d;--light-white:#f7f7f2;--light-red:#e5392d;--light-amber:#f0b54f;
        --p25:#c8372d;--p20:#2a5ea8;--p15:#d9ad1f;--p10:#3f8a4a;--p5:#f4f4f0;
        --f-display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
        --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
        color-scheme:light}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1612;--surface:#18221c;--surface-2:#223029;--line:#2f3f36;
          --ink:#edf4f2;--ink-2:#cfdcd5;--muted:#a3ab86;
          --primary:#c5cfa9;--on-primary:#0f1612;--accent:#e0a34a;--on-accent:#0f1612;
          --ok:#62b07a;--warn:#e0a34a;--bad:#e3826b;
          --panel:#050806;--light-off:#26302a;color-scheme:dark}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}                      /* atrybut hidden wygrywa z display:grid/flex */
  body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* nagłówek: tydzień · jednostka · data, tytuł, statystyki (czas, serie, tonaż) */
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--ink-2);padding:10px 16px 10px}
  .hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .eyebrow{font:600 12px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  h1{margin:2px 0 0;font:800 25px/1.02 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink-2);
     display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #sync{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;flex:none}
  .stats{display:flex;flex-wrap:wrap;gap:4px 0;margin-top:6px}
  .stats:empty{display:none}
  .stats span{display:flex;align-items:baseline;gap:6px;padding:0 12px;border-left:1px solid var(--line);
              font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .stats span:first-child{padding-left:0;border-left:0}
  .stats b{font:700 22px/1 var(--f-display);letter-spacing:.02em;color:var(--ink);text-transform:none}
  .tag{border:1px solid var(--accent);color:var(--accent);padding:3px 6px;border-radius:2px}
  .row{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);border-radius:0;
        padding:8px 12px 6px;min-height:44px;font:700 17px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
  .chip.on{color:var(--ink-2);border-bottom-color:var(--accent)}
  .chip small{display:block;font:500 12px/1.2 var(--f-mono);letter-spacing:0;text-transform:none}
  main{padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* dolne menu: zakładka aktywna = pasek akcentu u góry */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
       background:var(--surface);border-top:1px solid var(--ink-2);padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav button{position:relative;border:0;background:transparent;min-height:58px;display:grid;place-items:center;gap:2px;padding:6px 0;
              font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .nav svg{width:22px;height:22px}
  .nav button[aria-current="page"]{color:var(--ink-2)}
  .nav button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent)}

  /* ekran Plan */
  .tabs{border-bottom:1px solid var(--line);margin:8px 0 0}
  .strip{display:flex;gap:4px;margin:10px 0 2px;overflow-x:auto;scrollbar-width:none}
  .dayb{flex:1 0 52px;min-height:64px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--ink);
        display:grid;justify-items:center;align-content:center;gap:2px;padding:4px}
  .dayb small{font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .dayb b{font:700 22px/1 var(--f-display)}
  .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--olive);display:block}
  .dayb.done .dot{background:var(--ok);border-color:var(--ok)}
  .dayb.today{border-color:var(--accent)}
  .dayb.today .dot{background:var(--accent);border-color:var(--accent)}
  .unit{border-top:2px solid var(--ink-2);margin-top:18px;padding-top:10px}
  .unit.done{border-top-color:var(--ok)}
  .unit.today{border-top-color:var(--accent)}
  .uh{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start}
  .dd b{display:block;font:800 34px/1 var(--f-display);color:var(--ink-2)}
  .dd small,.ut small{display:block;font:600 12px/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .ut{font-size:15px;color:var(--ink-2)}
  .ut strong{font:700 22px/1 var(--f-display);text-transform:uppercase;color:var(--ink);margin-right:4px}
  .unit details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font:600 12px/1.2 var(--f-body);
                        letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .unit ol{margin:0 0 6px;padding-left:22px}
  .unit li{padding:6px 0;border-bottom:1px solid var(--line)}
  .unit li > b{display:block;font-weight:600}
  .unit li span{font-size:14px;color:var(--ink-2)}
  .uact{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btn.go{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .mvl{position:relative}
  .mvl input{position:absolute;inset:-1px;opacity:0;width:auto;height:auto;border:0;padding:0;cursor:pointer}
  .offer{margin-top:10px;border-left:4px solid var(--accent);padding:6px 0 6px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

  /* ćwiczenie = sekcja protokołu: linia 2 px nad nazwą, bez kart */
  .card{background:transparent;border:0;border-top:2px solid var(--ink-2);border-radius:0;padding:12px 0 16px;margin-top:18px}
  .card.k{border-top-color:var(--olive)}
  .ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .cn{font:700 25px/1.02 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink)}
  .badge{flex:0 0 auto;border-radius:2px;padding:3px 6px;font:600 12px/1.2 var(--f-mono);background:var(--surface-2);color:var(--muted)}
  .ch .badge{font:800 13px/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
  .badge.A{background:var(--primary);color:var(--on-primary)}
  .badge.B{background:transparent;border:1px solid var(--ink-2);color:var(--ink-2)}
  .badge.K{background:transparent;border:1px solid var(--olive);color:var(--muted)}
  .rx{margin:6px 0 4px;font-size:15px;color:var(--ink-2)}
  .rx b{font:500 16px var(--f-mono);color:var(--ink)}
  .rx .badge{display:inline-flex;align-items:center;gap:5px;vertical-align:1px}
  /* kolor talerza przy % 1RM: ≤60 biały, 61–70 zielony, 71–80 żółty, 81–90 niebieski, >90 czerwony */
  .zone{display:inline-block;width:11px;height:11px;border:1px solid var(--ink);flex:none}
  .zone.p5{background:var(--p5)}.zone.p10{background:var(--p10)}.zone.p15{background:var(--p15)}.zone.p20{background:var(--p20)}.zone.p25{background:var(--p25)}
  .last{font-size:13px;color:var(--muted);margin:2px 0 4px}
  /* przełącznik RPE / RIR w nagłówku */
  .trow{display:flex;align-items:flex-start;gap:8px}
  .trow h1{flex:1;min-width:0}
  .sc{display:flex;flex:none}
  .sc button{min-height:44px;min-width:48px;border:1px solid var(--ink-2);background:transparent;color:var(--muted);border-radius:0;
             font:600 12px/1 var(--f-body);letter-spacing:.06em}
  .sc button+button{border-left:0}
  .sc button[aria-pressed="true"]{background:var(--ink-2);color:var(--bg)}
  .note{font-size:14px;font-style:italic;color:var(--ink-2);margin:6px 0 8px;border-left:2px solid var(--olive);padding:2px 0 2px 10px}
  .hint{font-size:14px;color:var(--warn);margin:2px 0 6px}

  /* serie = wiersze tabeli */
  .sets{display:grid;gap:0;margin-top:8px}
  .set{display:grid;grid-template-columns:44px 1fr 1fr 62px 44px 44px;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
  .set.simple{grid-template-columns:44px 1fr 1fr 80px 44px 44px;gap:5px}
  .set.set-head{border-bottom:1px solid var(--ink-2);padding:0 0 6px;margin-top:10px}
  .set .n{position:relative;min-height:44px;display:flex;align-items:center;justify-content:center;
          font:700 21px/1 var(--f-display);color:var(--ink)}
  input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:2px;padding:9px 8px;font-size:16px}
  .set input,.set select{height:44px;border:0;background:transparent;text-align:center;padding:0 2px;min-width:0;
                         font:700 23px/1 var(--f-display);letter-spacing:.01em}
  .set select{appearance:none;-webkit-appearance:none;font-size:20px;text-align-last:center}
  .set.simple select{font:600 15px var(--f-body)}
  .set input::placeholder{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:1}
  .set:not(.set-head) > .lbl{font-size:12px;letter-spacing:0;text-transform:none}
  .set input:focus,.set select:focus{background:var(--surface-2)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .lbl{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
  .ok{height:44px;border-radius:2px;border:2px solid var(--ink-2);background:transparent;color:var(--line);font:700 20px/1 var(--f-body);padding:0}
  .set[data-st="ok"] .ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
  .set[data-st="x"] .ok{background:var(--bad);border-color:var(--bad);color:var(--surface)}
  .ok.pend{background:var(--warn);border-color:var(--warn);color:var(--surface)}
  /* numer serii jako przycisk typu: zwykła / drop / nieudana */
  .nt{width:100%;min-height:44px;border:0;background:transparent;padding:0;display:grid;place-items:center;align-content:center;
      font:700 21px/1 var(--f-display);color:var(--ink)}
  .nt small{font:600 12px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase}
  .set.t-d .nt{color:var(--accent)}
  .set.t-d .nt small::after{content:"drop"}
  .set[data-st="x"] .nt{color:var(--bad)}
  .set[data-st="x"] .nt small::after{content:"fail"}
  .set.k-w .n{color:var(--olive);font-size:17px}
  .set.k-w input{color:var(--muted)}
  .set.k-x .n{color:var(--ink-2)}
  .set.k-d .n{color:var(--accent);font-size:17px}
  .set.fail .rpe{color:var(--bad)}
  .set.fail .kg,.set.fail .reps{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
  /* ✕ przy ostatnim dodanym wierszu: cała komórka numeru to cel dotyku 44 px */
  .del{position:absolute;inset:0;border:0;background:transparent;color:var(--bad);padding:2px;
       display:flex;align-items:flex-end;justify-content:flex-end;font:700 12px/1 var(--f-body)}
  .del.arm{background:var(--bad);color:var(--surface);align-items:center;justify-content:center;border-radius:2px}

  .btn{border:1px solid var(--ink-2);background:transparent;color:var(--ink-2);border-radius:2px;padding:10px 12px;min-height:44px;
       font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center}
  .btn.p{background:var(--primary);border-color:var(--primary);color:var(--on-primary);width:100%;padding:12px;
         font:800 22px/1 var(--f-display);letter-spacing:.06em}
  .tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .btn.sm{padding:8px 10px}
  .btn.sm.x{border-color:var(--accent);color:var(--accent)}
  .btn.sm.d{border-color:var(--accent);color:var(--accent);border-style:dashed}
  .btn.all{width:100%;margin-top:8px;border-color:var(--ok);color:var(--ok);border-width:2px}
  .bar{height:3px;background:var(--surface-2);flex:1 1 120px;overflow:hidden;display:none}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  /* kamera przy serii: obrys = brak, wypełniona akcentem = jest film albo prędkość */
  .cam{height:44px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
  .cam svg{width:22px;height:22px}
  .cam.has{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .sh-in a.btn{text-decoration:none}
  /* analiza ścieżki i VBT */
  .vbox{background:var(--panel);display:grid;place-items:center}
  .vbox canvas{max-width:100%;max-height:52vh;width:auto;height:auto;display:block;touch-action:manipulation}   /* pionowy film nie spycha wyników poza ekran */
  .scrub{min-height:44px;padding:0;border:0;background:transparent;accent-color:var(--accent)}
  .metrics{display:flex;gap:0;margin:4px 0}
  .metric{flex:1;padding:0 10px;border-left:1px solid var(--line);display:grid;gap:2px}
  .metric:first-child{padding-left:0;border-left:0}
  .metric span{font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .metric b{font:800 30px/1 var(--f-display);color:var(--ink)}
  .metric small{font-size:12px;color:var(--muted)}
  svg.path{width:100%;height:auto;display:block;margin:4px auto}
  svg.path .grid{stroke:var(--line);stroke-width:1}
  svg.path .axis{font:500 12px var(--f-mono);fill:var(--muted)}
  svg.path .plumb{stroke:var(--olive);stroke-dasharray:3 4;stroke-width:1}
  svg.path .trace{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  svg.path .start{fill:var(--ink-2)}
  table.reps{width:100%;border-collapse:collapse;font:500 14px var(--f-mono)}
  table.reps th{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--ink-2)}
  table.reps td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
  table.reps th:first-child,table.reps td:first-child{text-align:left}
  .saved{border-left:4px solid var(--accent);padding-left:10px}
  .saved p{margin:0 0 4px}

  /* podsumowanie jednostki */
  .sess .cn{margin-bottom:4px}
  .sess label{display:block;margin:14px 0 6px;font:600 12px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  details.opt{margin-top:14px;border-top:1px dashed var(--line);padding:4px 0}
  details.opt summary{font-size:15px;padding:10px 0;min-height:44px;color:var(--ink-2);cursor:pointer}
  details.opt label{margin-top:8px}
  details.help{border-top:2px solid var(--accent);padding:10px 0;margin-top:14px}
  details.help summary{font:700 20px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink-2);cursor:pointer;min-height:44px;display:flex;align-items:center}
  details.help ol{margin:8px 0 2px;padding-left:20px;font-size:14px}
  details.help li{margin-bottom:6px}
  .timebox{display:flex;align-items:baseline;gap:12px;background:var(--panel);color:var(--light-white);border-radius:0;padding:10px 12px}
  .timebox .clock{font:800 34px/1 var(--f-display);letter-spacing:.04em;color:var(--light-amber);font-variant-numeric:tabular-nums}
  .timebox small{color:var(--light-white);opacity:.8;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  #toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);color:var(--light-white);
         border-left:4px solid var(--light-amber);padding:10px 16px;border-radius:0;font-size:15px;display:none;z-index:9;max-width:calc(100% - 32px)}
  .scale{display:grid;gap:4px;margin-top:4px}
  .scale.s5{grid-template-columns:repeat(5,1fr)}
  .scale.s11{grid-template-columns:repeat(6,1fr)}
  .pv{height:46px;border-radius:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 22px/1 var(--f-display)}
  .pv.on.n{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .pv.on.g{background:var(--ok);border-color:var(--ok);color:var(--surface)}
  .pv.on.a{background:var(--warn);border-color:var(--warn);color:var(--surface)}
  .pv.on.r{background:var(--bad);border-color:var(--bad);color:var(--surface)}
  .sub{font-size:13px;color:var(--muted);margin:-2px 0 4px}
  .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
  .pls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .pl{border:1px solid var(--ink-2);background:transparent;color:var(--ink-2);border-radius:2px;padding:9px 12px;min-height:44px;
      font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
  .pl.on{background:var(--ink-2);color:var(--bg)}
  .prow{margin-top:12px}
  .prow .plbl{font:700 18px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink-2)}
  .prow .plbl small{font:400 13px var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:40px 0}

  /* zamiana ćwiczenia */
  .swb{margin-top:6px}
  .swapped{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;font-size:14px;color:var(--ink-2);border-left:4px solid var(--accent);padding:2px 0 2px 10px}
  .opts{display:grid;gap:4px}
  .opts.why{grid-template-columns:1fr 1fr}
  .opt{min-height:48px;border:1px solid var(--ink-2);border-radius:2px;background:transparent;color:var(--ink);text-align:left;padding:8px 12px;font-size:15px}
  .opt[aria-pressed="true"]{background:var(--ink-2);color:var(--bg)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* boje: światła sędziowskie, wybór oceny, propozycja ciężaru */
  .set .lt,.set-head .hl2{grid-column:span 2}
  .lt{min-height:44px;border:0;border-radius:2px;background:var(--panel);color:var(--light-white);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px}
  .lt small{font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
  .lt.pend{outline:3px solid var(--warn);outline-offset:-3px}
  .lights{display:inline-flex;gap:4px}
  .lights i{width:14px;height:14px;border-radius:50%;background:var(--light-off);display:block}
  .lights i.w{background:var(--light-white)}
  .lights i.r{background:var(--light-red)}
  .rate{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px 0;border-bottom:1px solid var(--line)}
  .rate button{min-height:56px;border:1px solid var(--light-off);border-radius:2px;background:var(--panel);color:var(--light-white);
               display:grid;justify-items:center;align-content:center;gap:3px;padding:6px}
  .rate button[aria-pressed="true"]{outline:3px solid var(--light-amber);outline-offset:-3px}
  .rate b{font:700 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
  .rate small{font-size:12px;opacity:.85}
  .rate .rclr{grid-column:1/-1;min-height:44px;background:transparent;color:var(--ink-2);border-color:var(--line)}
  .sug{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-left:4px solid var(--muted);padding:6px 0 6px 10px;margin:6px 0;font-size:14px}
  .sug.up{border-left-color:var(--ok)}
  .sug.down{border-left-color:var(--warn)}
  .rx .badge + b,.rx b{white-space:nowrap}

  /* timer przerwy: ciemny pasek na całą szerokość nad dolnym menu, bursztynowe cyfry */
  #rest{position:fixed;left:0;right:0;bottom:calc(59px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--panel);color:var(--light-white);
        padding:8px 16px 0;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
  .rtop{display:grid;min-width:0}
  .rlbl{font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rtime{font:800 46px/1 var(--f-display);letter-spacing:.04em;color:var(--light-amber);font-variant-numeric:tabular-nums}
  .rbtns{display:flex;gap:6px}
  .rbtns button{min-height:44px;min-width:52px;border:1px solid var(--light-off);background:transparent;color:var(--light-white);border-radius:2px;
                font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:0 8px}
  .rbar{grid-column:1/-1;height:3px;background:var(--light-off);margin:6px -16px 0}
  .rbar i{display:block;height:100%;background:var(--light-amber);width:100%}
  body.resting main{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
  body.resting #toast{bottom:calc(170px + env(safe-area-inset-bottom,0px))}

  /* okno od dołu (kalkulator talerzy, później zamiana ćwiczenia i kamera) */
  #sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--panel) 55%,transparent)}
  .sh-in{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-top:3px solid var(--ink-2);
         padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-width:640px;margin:0 auto}
  .sh-in h2{margin:0;font:800 28px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink-2)}
  .sh-in .sub{margin:-6px 0 0}
  .fl{display:grid;gap:6px;font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .fl input{font:700 26px/1 var(--f-display);min-height:48px;text-transform:none;letter-spacing:.01em}
  .fl input::placeholder{font:400 16px var(--f-body);color:var(--muted);opacity:1}
  #sw-own{font:400 17px/1.3 var(--f-body)}
  .seg{display:flex}
  .seg button,.btn.tg{flex:1;min-height:44px;border:1px solid var(--ink-2);background:transparent;color:var(--ink-2);border-radius:0;
                      font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
  .seg button+button{border-left:0}
  .seg button[aria-pressed="true"],.btn.tg[aria-pressed="true"]{background:var(--ink-2);color:var(--bg)}
  .pl-bar{display:flex;align-items:center;gap:3px;min-height:96px;padding:6px 0}
  .pl-bar .sleeve{width:36px;height:12px;background:var(--olive)}
  .pl-bar .clamp{width:8px;height:22px;background:var(--olive)}
  .pp{display:grid;place-items:center;width:30px;border:1px solid var(--ink);border-radius:2px;font:700 12px/1 var(--f-body)}
  .pp.p25{height:92px;background:var(--p25);color:var(--light-white)}
  .pp.p20{height:92px;background:var(--p20);color:var(--light-white)}
  .pp.p15{height:80px;background:var(--p15);color:var(--panel)}
  .pp.p10{height:66px;background:var(--p10);color:var(--light-white)}
  .pp.p5{height:50px;background:var(--p5);color:var(--panel)}
  .pp.ps{height:38px;background:var(--surface-2);color:var(--ink)}
  .pl-txt{margin:0;font:500 16px var(--f-mono)}
</style>
</head>
<body>
<header>
  <div class="hrow"><span class="eyebrow" id="eyebrow"></span><span id="sync">ładowanie…</span></div>
  <div class="trow"><h1 id="title">Trening</h1><span id="hx"></span></div>
  <div class="stats" id="stats"></div>
</header>
<main id="main"><div class="empty">Ładowanie planu…</div></main>
<main id="plan" hidden></main>
<nav class="nav" id="nav" hidden>
  <button type="button" data-tab="trening"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>Trening</button>
  <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v15H4zM4 10h16M9 3v4M15 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>Plan</button>
</nav>
<div id="rest" hidden role="timer" aria-live="off">
  <div class="rtop"><span class="rlbl" id="rlbl">Przerwa</span><b class="rtime" id="rtime">0:00</b></div>
  <div class="rbtns"><button type="button" data-r="-15">−15</button><button type="button" data-r="15">+15</button><button type="button" data-r="0">Pomiń</button></div>
  <div class="rbar"><i id="rfill"></i></div>
</div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div class="sh-in" id="sheet-in"></div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="lib.js"></script>
<script>
/* ---------- konfiguracja: klucz z linku (?k=…) zapamiętany w telefonie; ustawienia klienta przychodzą z getData ---------- */
const API_URL = window.API_URL;                    // z config.js
const KEY = (() => {
  const k = new URLSearchParams(location.search).get('k');
  try { if (k) localStorage.setItem('key', k); return k || localStorage.getItem('key') || ''; } catch (e) { return k || ''; }
})();
let PAIN = false;      // Klienci F „bol” = TAK → kolano i bark zawsze zaznaczone
let SIMPLE = false;    // Klienci G „tryb” = PROSTY
let EXTRA_DEF = 0;     // Klienci H „dod_serie”; Plan „dod_serie” nadpisuje
let NAME = '';
let SCALE = 'RPE';     // Klienci K „skala” (RPE/RIR); przełącznik w nagłówku zapamiętany w telefonie (sc_<klucz>)
let OLY_CEIL = 0.05;   // Klienci L „sufit_oly”: ułamek 1RM ponad plan dla bojów
let SWAP = false;      // Klienci J „zamiana” = TAK → przycisk „Zamień” przy ćwiczeniu
function applyCfg(c){
  if (!c) return;
  PAIN = !!c.pain; SIMPLE = !!c.simple; EXTRA_DEF = Number(c.extra) || 0;
  NAME = c.name || ''; document.title = 'Trening – ' + c.name;
  let own = null; try { own = localStorage.getItem('sc_' + KEY); } catch (e) {}
  SCALE = own || (c.scale === 'RIR' ? 'RIR' : 'RPE');
  OLY_CEIL = c.olyCeil >= 0 ? Number(c.olyCeil) : 0.05;
  SWAP = !!c.swap;
}
let DATA = null, PLAN = [], LOGS = {}, SESS = {}, cur = {week: 1, day: null};
let TAB = 'trening';   // ekran z dolnego menu: trening | plan
let PW = null;         // tydzień oglądany na ekranie Plan
let lastMove = null;   // ostatnie przesunięcie jednostki → propozycja „przesuń też kolejne”
const RPE = ['', '5', '5.5', '6', '6.5', '7', '7.5', '8', '8.5', '9', '9.5', '10'];
// tryb prosty: słowa zamiast RPE; w arkuszu nadal zapisuje się liczba RPE
const EFFORT = [['', '–'], ['6', 'Lekko'], ['7.5', 'Średnio'], ['9', 'Ciężko'], ['10', 'Max']];
const $ = s => document.querySelector(s);
// czyste funkcje z lib.js (testy: tests/lib.test.js)
const { fmtKg, num, esc, blank, plural, effortVal, floor25, isNum, setKey, repsDefault, localDate,
  addDays, dayDiff, ddmm, weekday, monthShort, units, lightWeeks, blockInfo, unitStats,
  RIR_OPTS, rirOfRpe, rpeOfRir, rirMin, plateZone, lastTop, restSec, fmtClock, plates,
  isOly, RATE, rateOf, olyCap, sugOly, SWAP_WHY, swapOptions, swapText, parseSwap,
  PLATE_M, analyse, vbtOut, pathSVG, groupOf } = window.TL;

/* ---------- kolejka offline ---------- */
const QK = 'q_' + KEY;
function qGet(){ try { return JSON.parse(localStorage.getItem(QK) || '[]'); } catch(e){ return []; } }
function qSet(q){ try { localStorage.setItem(QK, JSON.stringify(q)); } catch(e){} }
// API Apps Script: POST text/plain (bez preflight CORS) → {ok, result} | {ok:false, error}
function call(fn, ...args){
  return fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ fn, key: KEY, args }) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => { if (!j.ok) throw new Error(j.error || 'błąd serwera'); return j.result; });
}
function send(fn, payload){
  setSync('zapisywanie…');
  return call(fn, payload).then(r => { setSync('zapisano ✓'); return r; })
    .catch(err => { const q = qGet(); q.push({fn, payload}); qSet(q); setSync('offline – w kolejce (' + q.length + ')'); throw err; });
}
async function flush(){
  const q = qGet(); if (!q.length) return;
  const rest = [];
  for (const it of q) { try { await call(it.fn, it.payload); } catch(e) { rest.push(it); } }
  qSet(rest); setSync(rest.length ? 'offline – w kolejce (' + rest.length + ')' : 'zsynchronizowano ✓');
  // wysłane serie przestają być żółte
  document.querySelectorAll('.set .ok.pend').forEach(b => {
    const r = b.closest('.set'), ex = PLAN.find(x => x.week === cur.week && x.day === cur.day && x.order === +r.dataset.o);
    if (ex && !queued(ex, r.dataset.s)) b.classList.remove('pend');
  });
}
window.addEventListener('online', flush);
function setSync(t){ $('#sync').textContent = t; }
function toast(t){ const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 2500); }

/* ---------- czas jednostki: od pierwszego wpisu do „Zakończ” ---------- */
const TK = 't_' + KEY;
function tGet(){ try { return JSON.parse(localStorage.getItem(TK) || '{}'); } catch(e){ return {}; } }
function tSet(m){ try { localStorage.setItem(TK, JSON.stringify(m)); } catch(e){} }
const skey = () => cur.week + '|' + cur.day;
function curSess(){
  return SESS['local|' + skey()] || Object.values(SESS).find(x => String(x.id).endsWith('|' + skey())) || {};
}
function startOf(){
  const cand = [];
  const loc = tGet()[skey()]; if (loc) cand.push(loc);
  // awaryjnie: najwcześniejszy zapis serii z serwera (np. inny telefon / wyczyszczona przeglądarka)
  Object.values(LOGS).forEach(l => {
    const p = String(l.id).split('|');
    if (p[0] !== 'local' && p[1] === String(cur.week) && p[2] === String(cur.day) && l.zapisano) {
      const t = Date.parse(l.zapisano); if (!isNaN(t)) cand.push(t);
    }
  });
  return cand.length ? Math.min(...cand) : null;
}
function markStart(){
  if (!cur.day || curSess().id) return;           // jednostka już zamknięta – nie liczymy od nowa
  const m = tGet();
  if (!m[skey()]) { m[skey()] = Date.now(); tSet(m); tick(); }
  wake(true);
}
function fmtDur(ms){
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
}
function clockText(){
  const s = curSess();
  if (s.id) return blank(s.czas_min) ? '–' : s.czas_min + ' min';
  const st = startOf();
  return st ? fmtDur(Date.now() - st) : '00:00';
}
function tick(){ document.querySelectorAll('.clock').forEach(e => e.textContent = clockText()); }
setInterval(tick, 1000);

/* ---------- przerwa po serii (A 2:00, B 1:30, K 1:00) ---------- */
let REST = null;   // {end, total}
function startRest(ex){
  const total = restSec(ex.prio);
  REST = { end: Date.now() + total * 1000, total };
  $("#rlbl").textContent = "Przerwa · " + ex.name;
  $("#rest").hidden = false; document.body.classList.add("resting");
  restTick();
}
function stopRest(){ REST = null; $("#rest").hidden = true; document.body.classList.remove("resting"); }
function restTick(){
  if (!REST) return;
  const left = (REST.end - Date.now()) / 1000;
  if (left <= 0) { stopRest(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); toast("Koniec przerwy."); return; }
  $("#rtime").textContent = fmtClock(left);
  $("#rfill").style.width = Math.min(100, 100 * left / REST.total) + "%";
}
setInterval(restTick, 250);
document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
  if (!REST) return;
  const d = +b.dataset.r;
  if (!d) { stopRest(); return; }
  REST.end += d * 1000; REST.total = Math.max(REST.total, (REST.end - Date.now()) / 1000); restTick();
});

/* ---------- ekran bez wygaszania: od pierwszego wpisu do „Zakończ” (Wake Lock) ---------- */
let WAKE = null, WAKE_ON = false;
async function wake(on){
  WAKE_ON = on;
  try {
    if (on && !WAKE && navigator.wakeLock) {
      WAKE = navigator.wakeLock.request("screen");                 // obietnica: drugie dotknięcie nie prosi ponownie
      const w = await WAKE; WAKE = w; w.addEventListener("release", () => { if (WAKE === w) WAKE = null; });
      if (!WAKE_ON) { WAKE = null; w.release(); }
    }
    if (!on && WAKE) { const w = await WAKE; WAKE = null; await w.release(); }
  } catch (e) { WAKE = null; }
}
// system zwalnia blokadę po schowaniu aplikacji → po powrocie prosimy ponownie
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && WAKE_ON) wake(true); });

/* ---------- okno (arkusz od dołu) i kalkulator talerzy ---------- */
function openSheet(html){
  $("#sheet-in").innerHTML = html; $("#sheet").hidden = false;
  const f = $("#sheet-in input, #sheet-in button"); if (f) f.focus();
}
let SHEET_ON_CLOSE = null;
function closeSheet(){ const f = SHEET_ON_CLOSE; SHEET_ON_CLOSE = null; if (f) f(); $("#sheet").hidden = true; $("#sheet-in").innerHTML = ""; }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet" || e.target.closest("[data-close]")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
let BAR = 20, COLLARS = true;
try { const s = JSON.parse(localStorage.getItem("pl_" + KEY) || "null"); if (s) { BAR = s.bar; COLLARS = s.col; } } catch (e) {}
const plateCls = p => ({ 25: "p25", 20: "p20", 15: "p15", 10: "p10", 5: "p5" })[p] || "ps";
function openPlates(ex){
  const rows = [...document.querySelectorAll(`.set[data-o="${ex.order}"]:not([data-k="w"])`)];
  const next = rows.find(r => !r.dataset.st) || rows[rows.length - 1];
  const kg0 = next ? num(next.querySelector(".kg").value) : ex.kg;
  openSheet(`<h2 id="sheet-t">Talerze</h2><p class="sub">${esc(ex.name)} · na każdą stronę</p>
    <label class="fl">Ciężar na sztandze (kg)<input id="pl-kg" inputmode="decimal" value="${esc(fmtKg(kg0))}"></label>
    <div class="seg" role="group" aria-label="Gryf">${[20, 15].map(b => `<button type="button" data-bar="${b}">Gryf ${b} kg</button>`).join("")}</div>
    <button type="button" class="btn sm tg" id="pl-col">Zamki 2 × 2,5 kg</button>
    <div id="pl-out" aria-live="polite"></div>
    <button type="button" class="btn p" data-close>Zamknij</button>`);
  const draw = () => {
    document.querySelectorAll("[data-bar]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.bar === BAR));
    $("#pl-col").setAttribute("aria-pressed", COLLARS);
    try { localStorage.setItem("pl_" + KEY, JSON.stringify({ bar: BAR, col: COLLARS })); } catch (e) {}
    const kg = num($("#pl-kg").value), r = plates(kg, BAR, COLLARS ? 5 : 0);
    $("#pl-out").innerHTML = !isNum(kg) ? "<p>Wpisz ciężar w kg.</p>"
      : r.under ? `<p>Mniej niż gryf${COLLARS ? " z zamkami" : ""} (${fmtKg(BAR + (COLLARS ? 5 : 0))} kg).</p>`
      : `<div class="pl-bar" aria-hidden="true"><span class="sleeve"></span>${r.side.map(p => `<span class="pp ${plateCls(p)}">${fmtKg(p)}</span>`).join("")}<span class="clamp"></span></div>
         <p class="pl-txt">${r.side.length ? r.side.map(fmtKg).join(" + ") + " kg" : "Sam gryf" + (COLLARS ? " z zamkami" : "")}${r.rest ? ` · brakuje ${fmtKg(r.rest)} kg (nie ma takich talerzy)` : ""}</p>`;
  };
  $("#pl-kg").oninput = draw;
  document.querySelectorAll("[data-bar]").forEach(b => b.onclick = () => { BAR = +b.dataset.bar; draw(); });
  $("#pl-col").onclick = () => { COLLARS = !COLLARS; draw(); };
  draw();
}

/* ---------- dane ---------- */
// ostatnie dane trzymane w telefonie → aplikacja otwiera się od razu, także bez sieci
const DK = 'd_' + KEY;
function useData(d){
  applyCfg(d.cfg);
  DATA = d; PLAN = d.plan; LOGS = {}; SESS = {};
  d.logs.forEach(l => LOGS[l.id] = l);
  d.sessions.forEach(s => SESS[s.id] = s);
  // lokalne, jeszcze niewysłane zapisy z kolejki nadpisują dane z serwera
  qGet().forEach(it => {
    const p = it.payload;
    if (it.fn === 'logSet') { const id = ['local', p.week, p.day, p.order, p.set].join('|'); LOGS[id] = { id, kg: p.kg, powt: p.reps, rpe: p.rpe, vbt_ms: p.vbt, wykonane: p.done ? 'TAK' : '', film_link: p.video, typ: p.typ, ocena: p.ocena || '', zamiana: p.swap || '', vbt_peak: p.vbtPeak, wysokosc_cm: p.height, sciezka: p.path }; }
    if (it.fn === 'przesunJednostke') applyMoves(p, false);
  });
}
/** nowe daty jednostek w planie (lokalnie; serwer dostaje je przez send/kolejkę); save = zapis w pamięci telefonu */
function applyMoves(moves, save){
  [].concat(moves || []).forEach(m => PLAN.forEach(r => { if (r.week === m.week && r.day === m.day) r.date = m.date; }));
  if (save && DATA) try { localStorage.setItem(DK, JSON.stringify(DATA)); } catch (e) {}
}
function load(){
  if (!KEY) { $('#main').innerHTML = '<div class="empty">Otwórz aplikację z linku od trenera (zawiera Twój kod).</div>'; setSync(''); return; }
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(DK) || 'null'); } catch (e) {}
  if (cached) { useData(cached); pickDefault(); render(); setSync('offline – ostatnie dane'); }
  call('getData').then(d => {
    try { localStorage.setItem(DK, JSON.stringify(d)); } catch (e) {}
    const keep = cached ? { w: cur.week, d: cur.day } : null;
    useData(d);
    if (keep) { cur.week = keep.w; cur.day = keep.d; } else pickDefault();
    render(); setSync('gotowe'); flush();
  }).catch(e => {
    if (!cached) { $('#main').innerHTML = '<div class="empty">Błąd: ' + esc(e.message) + '</div>'; setSync('błąd'); }
    else setSync('offline – ostatnie dane');
  });
}
function pickDefault(){
  const today = localDate();                         // strefa telefonu (UTC po północy dawało wczoraj)
  const all = [...new Map(PLAN.map(r => [r.week + '|' + r.day, r])).values()].sort((a, b) => a.date.localeCompare(b.date));
  const s = all.find(r => r.date >= today) || all[all.length - 1];
  if (s) { cur.week = s.week; cur.day = s.day; }
}
const lid = (ex, set) => ['', cur.week, cur.day, ex.order, set].join('|');
function getLog(ex, set){
  const suffix = lid(ex, set);
  if (LOGS['local' + suffix]) return LOGS['local' + suffix];
  for (const k in LOGS) if (k.endsWith(suffix)) return LOGS[k];
  return null;
}
function sessDone(week, day){ return Object.keys(SESS).some(k => k.endsWith('|' + week + '|' + day)); }

/* ---------- tryb prosty: ściągawka przy pierwszym uruchomieniu ---------- */

/* ---------- render ---------- */
function render(){
  $('#nav').hidden = !PLAN.length;
  document.querySelectorAll('#nav [data-tab]').forEach(b => {
    b.setAttribute('aria-current', b.dataset.tab === TAB ? 'page' : 'false');
    b.onclick = () => { TAB = b.dataset.tab; if (TAB === 'plan') PW = cur.week; render(); window.scrollTo(0, 0); };
  });
  $('#main').hidden = TAB !== 'trening'; $('#plan').hidden = TAB !== 'plan';
  if (TAB === 'plan') renderPlan(); else renderTrening();
}
function head(eyebrow, title, stats, extra){
  $('#eyebrow').textContent = eyebrow; $('#title').textContent = title; $('#stats').innerHTML = stats || ''; $('#hx').innerHTML = extra || '';
}
const weekLabel = w => { const b = blockInfo(PLAN, w); return b ? 'Blok ' + b.block + ' · tydz. ' + b.n : 'Tydz. ' + w; };
/** czas, serie zrobione/wszystkie, tonaż bieżącej jednostki w nagłówku */
function refreshStats(){
  if (TAB !== 'trening') return;
  const exs = PLAN.filter(r => r.week === cur.week && r.day === cur.day);
  const st = unitStats(exs, exLogs);
  const sets = $('#st-sets'), ton = $('#st-ton');
  if (sets) sets.textContent = st.done + '/' + st.all;
  if (ton) ton.textContent = st.ton.toLocaleString('pl-PL');
}

/* ---------- ekran Plan: tygodnie, dni z kropkami, jednostki, zmiana daty ---------- */
function renderPlan(){
  const weeks = [...new Set(PLAN.map(r => r.week))].sort((a, b) => a - b), light = lightWeeks(PLAN), today = localDate();
  if (!weeks.includes(PW)) PW = weeks.includes(cur.week) ? cur.week : weeks[0];
  const bi = blockInfo(PLAN, PW);
  head(NAME ? 'Plan · ' + NAME : 'Plan', weekLabel(PW), light.has(PW) ? '<span class="tag">tydzień lżejszy</span>' : '');
  const us = units(PLAN).filter(u => u.week === PW);
  const state = u => sessDone(u.week, u.day) ? 'done' : u.date === today ? 'today' : '';
  let h = `<div class="row tabs" role="tablist">` + weeks.map(w => {
    const b = blockInfo(PLAN, w), sub = [b ? b.block : '', light.has(w) ? 'lżejszy' : ''].filter(Boolean).join(' · ');
    return `<button class="chip ${w === PW ? 'on' : ''}" data-pw="${w}" role="tab" aria-selected="${w === PW}">Tydz. ${b ? b.n : w}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;
  }).join('') + `</div>`;
  h += `<div class="strip">` + us.map(u => `<button class="dayb ${state(u)}" data-jump="${u.week}|${esc(u.day)}"><small>${weekday(u.date)}</small><b>${ddmm(u.date).slice(0, 2)}</b><i class="dot" aria-hidden="true"></i><span class="sr">${esc(u.day)} ${state(u) === 'done' ? 'zrobiona' : state(u) === 'today' ? 'dziś' : 'zaplanowana'}</span></button>`).join('') + `</div>`;
  us.forEach(u => {
    const done = sessDone(u.week, u.day), k = u.week + '|' + u.day;
    const exs = u.rows.slice().sort((a, b) => a.order - b.order);
    const offer = lastMove && lastMove.week === u.week && lastMove.day === u.day
      ? `<div class="offer"><span>Przesunięto na ${weekday(u.date)} ${ddmm(u.date)}.</span>
          <button class="btn sm" data-shift>Przesuń też kolejne (${lastMove.delta > 0 ? '+' : ''}${lastMove.delta} ${Math.abs(lastMove.delta) === 1 ? 'dzień' : 'dni'})</button>
          <button class="btn sm" data-noshift>Nie</button></div>` : '';
    h += `<section class="unit ${state(u)}" id="u-${u.week}-${esc(u.day)}">
      <div class="uh"><div class="dd"><b>${ddmm(u.date).slice(0, 2)}</b><small>${weekday(u.date)} · ${monthShort(u.date)}</small></div>
        <div class="ut"><strong>${esc(u.day)}</strong> ${esc(u.title)}<small>${exs.length} ${plural(exs.length, 'ćwiczenie', 'ćwiczenia', 'ćwiczeń')} · ${done ? 'zrobiona ✓' : u.date === today ? 'dziś' : u.date < today ? 'niezrobiona' : 'zaplanowana'}</small></div></div>
      <details><summary>Ćwiczenia</summary><ol>${exs.map(ex => `<li><b>${esc(ex.name)}</b><span>${SIMPLE ? rxSimple(ex) : rxPro(ex)}</span></li>`).join('')}</ol></details>
      <div class="uact"><button class="btn go" data-go="${k}">Przejdź do treningu</button>
        ${done ? '' : `<label class="btn mvl">Zmień datę<input type="date" class="mv" data-mv="${k}" value="${u.date}" aria-label="Nowa data ${esc(u.day)}"></label>`}</div>
      ${offer}</section>`;
  });
  $('#plan').innerHTML = h;
  const unitOf = k => { const [w, d] = k.split('|'); return units(PLAN).find(u => String(u.week) === w && u.day === d); };
  document.querySelectorAll('[data-pw]').forEach(b => b.onclick = () => { PW = +b.dataset.pw; lastMove = null; renderPlan(); });
  document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    const u = unitOf(b.dataset.jump), s = document.getElementById('u-' + u.week + '-' + u.day);
    s.querySelector('details').open = true; s.scrollIntoView({ block: 'start' });
  });
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const u = unitOf(b.dataset.go); cur.week = u.week; cur.day = u.day; TAB = 'trening'; lastMove = null; render(); window.scrollTo(0, 0);
  });
  document.querySelectorAll('input[data-mv]').forEach(inp => inp.onchange = () => moveUnit(unitOf(inp.dataset.mv), inp.value));
  const sh = $('[data-shift]'); if (sh) sh.onclick = shiftRest;
  const ns = $('[data-noshift]'); if (ns) ns.onclick = () => { lastMove = null; renderPlan(); };
}
/** klient przesuwa niezrobioną jednostkę; potem propozycja przesunięcia kolejnych o tyle samo dni */
function moveUnit(u, date){
  if (!u || !/^\d{4}-\d{2}-\d{2}$/.test(date) || date === u.date || sessDone(u.week, u.day)) return;
  const move = { week: u.week, day: u.day, date };
  lastMove = { week: u.week, day: u.day, from: u.date, delta: dayDiff(u.date, date) };
  applyMoves([move], true);
  send('przesunJednostke', [move]).catch(() => {});
  renderPlan();
}
function shiftRest(){
  if (!lastMove) return;
  const m = lastMove, moves = units(PLAN)
    .filter(u => !(u.week === m.week && u.day === m.day) && u.date > m.from && !sessDone(u.week, u.day))
    .map(u => ({ week: u.week, day: u.day, date: addDays(u.date, m.delta) }));
  lastMove = null;
  if (moves.length) { applyMoves(moves, true); send('przesunJednostke', moves).catch(() => {}); }
  toast(moves.length ? 'Przesunięto ' + moves.length + ' ' + plural(moves.length, 'jednostkę', 'jednostki', 'jednostek') + '.' : 'Brak kolejnych jednostek.');
  renderPlan();
}

/* ---------- zamiana ćwiczenia: zapis w telefonie (sw_<klucz>) i w Logu (kolumna „zamiana”) ---------- */
const SWK = 'sw_' + KEY;
function swGet(){ try { return JSON.parse(localStorage.getItem(SWK) || '{}'); } catch (e) { return {}; } }
const swKey = ex => cur.week + '|' + cur.day + '|' + ex.order;
/** ćwiczenie z naniesioną zamianą: telefon (także „cofnięta” = null) ma pierwszeństwo przed wpisami z Logu */
function withSwap(ex){
  const m = swGet(), k = swKey(ex);
  let s = k in m ? m[k] : null;
  if (!(k in m)) { const l = Object.values(exLogs(ex)).find(x => x.zamiana); s = l ? parseSwap(l.zamiana) : null; }
  return s && s.to ? Object.assign({}, ex, { name: s.to, swap: s }) : ex;
}
function setSwap(ex, s){
  const m = swGet(); m[swKey(ex)] = s;
  try { localStorage.setItem(SWK, JSON.stringify(m)); } catch (e) {}
}
function openSwap(ex){
  const opts = swapOptions(ex);
  let to = '', why = '';
  openSheet(`<h2 id="sheet-t">Zamień ćwiczenie</h2><p class="sub">Zamiast: ${esc(ex.name)}</p>
    ${opts.length ? `<div class="opts" role="group" aria-label="Zamiennik">${opts.map(o => `<button type="button" class="opt" data-to="${esc(o)}">${esc(o)}</button>`).join('')}</div>` : ''}
    <label class="fl">${opts.length ? 'Albo inne ćwiczenie' : 'Ćwiczenie zamiast'}<input id="sw-own" placeholder="nazwa" autocomplete="off"></label>
    <div class="fl">Powód</div>
    <div class="opts why" role="group" aria-label="Powód">${SWAP_WHY.map(w => `<button type="button" class="opt" data-why="${w}">${w}</button>`).join('')}</div>
    <p class="hint" id="sw-hint" hidden>Ból: na końcu treningu zaznacz miejsce i oceń ból 0–10 w podsumowaniu.</p>
    <button type="button" class="btn p" id="sw-ok" disabled>Zamień</button>
    <button type="button" class="btn" data-close>Anuluj</button>`);
  const upd = () => {
    document.querySelectorAll('#sheet [data-to]').forEach(b => b.setAttribute('aria-pressed', b.dataset.to === to));
    document.querySelectorAll('#sheet [data-why]').forEach(b => b.setAttribute('aria-pressed', b.dataset.why === why));
    $('#sw-hint').hidden = why !== 'Ból';
    $('#sw-ok').disabled = !to || !why;
  };
  document.querySelectorAll('#sheet [data-to]').forEach(b => b.onclick = () => { to = b.dataset.to; $('#sw-own').value = ''; upd(); });
  document.querySelectorAll('#sheet [data-why]').forEach(b => b.onclick = () => { why = b.dataset.why; upd(); });
  $('#sw-own').oninput = e => { to = e.target.value.trim(); upd(); };
  $('#sw-ok').onclick = () => {
    setSwap(ex, { from: ex.name, to, why }); closeSheet();
    toast('Zamieniono na: ' + to + '. Serie zapiszą się pod nową nazwą.');
    renderTrening();
  };
  upd();
}

/* ---------- ekran Trening ---------- */
function renderTrening(){
  let exs = PLAN.filter(r => r.week === cur.week && r.day === cur.day).sort((a, b) => a.order - b.order);
  if (!exs.length) { pickDefault(); exs = PLAN.filter(r => r.week === cur.week && r.day === cur.day).sort((a, b) => a.order - b.order); }
  exs = exs.map(withSwap);
  if (!exs.length) { head(NAME, 'Trening'); $('#main').innerHTML = '<div class="empty">Brak planu.</div>'; return; }
  const s0 = exs[0];
  head(weekLabel(cur.week) + ' · ' + cur.day + ' · ' + weekday(s0.date) + ' ' + ddmm(s0.date) + (sessDone(cur.week, cur.day) ? ' · zrobiona ✓' : ''),
    s0.title || cur.day,
    `<span>Czas <b class="clock">${clockText()}</b></span><span>Serie <b id="st-sets"></b></span><span>Tonaż <b id="st-ton"></b> kg</span>`,
    (SIMPLE ? '' : `<span class="sc" role="group" aria-label="Skala">${['RPE', 'RIR'].map(s => `<button type="button" data-sc="${s}" aria-pressed="${SCALE === s}">${s}</button>`).join('')}</span>`));
  document.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => {
    SCALE = b.dataset.sc; try { localStorage.setItem('sc_' + KEY, SCALE); } catch (e) {}
    renderTrening();
  });
  let h = helpCard();
  exs.forEach(ex => h += card(ex));
  h += sessCard(s0);
  $('#main').innerHTML = h;
  bind(exs, s0);
  refreshStats();
}
function rxPro(ex){
  const hasKg = typeof ex.kg === 'number', z = plateZone(ex.pct);
  return `${ex.sets}×${esc(ex.reps)}` + (ex.kg !== '' ? ` · <b>${esc(fmtKg(ex.kg))}${hasKg ? ' kg' : ''}</b>` : '') +
         (ex.pct !== null ? ` <span class="badge">${z ? `<i class="zone ${z}" aria-hidden="true"></i>` : ''}${Math.round(ex.pct * 1000) / 10}%</span>` : '') +
         (isOly(ex) ? maxToday(ex) : ex.rpe === '' ? '' : SCALE === 'RIR' ? ` · RIR ≥${rirMin(ex.rpe)}` : ` · RPE ≤${esc(fmtKg(ex.rpe))}`);
}
/* ---------- boje: sufit dnia (plan + sufit_oly × 1RM; słaba dyspozycja dnia → plan) ---------- */
const dayOf = v => /T/.test(String(v)) ? localDate(new Date(v)) : String(v || '').slice(0, 10);
/** dzisiejsza dyspozycja „Uwaga” / „Zmęczenie” → tekst do propozycji; inaczej '' */
function weakToday(){
  const r = ((DATA && DATA.readiness) || []).filter(x => dayOf(x.data) === localDate()).pop();
  return r && /uwaga|zmęcz/i.test(r.werdykt || '') ? String(r.werdykt).toLowerCase() : '';
}
function capOf(ex){
  const why = weakToday(), kg = isNum(ex.kg) ? ex.kg : NaN;
  return { cap: olyCap(kg, ex.pct, OLY_CEIL, !!why), one: kg > 0 && ex.pct > 0 ? kg / ex.pct : 0, weak: !!why, why };
}
const maxToday = ex => { const c = capOf(ex).cap; return c ? ` · max dziś <b>${fmtKg(c)} kg</b>` : ''; };
const lightsHtml = q => `<span class="lights" aria-hidden="true">${[...(RATE[q] ? RATE[q].lights : 'ooo')].map(c => `<i class="${c}"></i>`).join('')}</span>`;
const RATE_HINT = { L: '3 białe', S: '2 białe, 1 czerwone', W: '1 białe, 2 czerwone', X: '3 czerwone' };
const rateHtml = cur => `<div class="rate" role="group" aria-label="Ocena podejścia">` +
  ['L', 'S', 'W', 'X'].map(q => `<button type="button" data-q="${q}" aria-pressed="${cur === q}">${lightsHtml(q)}<b>${RATE[q].label}</b><small>${RATE_HINT[q]}</small></button>`).join('') +
  (cur ? '<button type="button" class="rclr" data-q="">Wyczyść ocenę</button>' : '') + '</div>';
/** propozycja ciężaru pod ostatnio ocenionym podejściem (tylko gdy zostały serie) */
function updateSug(ex){
  if (!isOly(ex)) return;
  document.querySelectorAll(`.sug[data-o="${ex.order}"]`).forEach(x => x.remove());
  const rows = [...document.querySelectorAll(`.set[data-o="${ex.order}"]:not([data-k="w"])`)];
  const model = rows.map(r => ({ kg: num(r.querySelector('.kg').value), rate: r.dataset.rate || '', done: !!r.dataset.st }));
  let i = -1; model.forEach((m, j) => { if (m.done && m.rate) i = j; });
  const s = i < 0 || !isNum(model[i].kg) ? null : sugOly(model, i, capOf(ex));
  if (!s) return;
  const at = rows[i].nextElementSibling && rows[i].nextElementSibling.classList.contains('rate') ? rows[i].nextElementSibling : rows[i];
  at.insertAdjacentHTML('afterend', `<div class="sug ${s.lvl}" data-o="${ex.order}"><span>${esc(s.txt)}</span>` +
    (s.kg !== model[i].kg ? `<button type="button" class="btn sm" data-setkg="${s.kg}">Ustaw ${fmtKg(s.kg)} kg</button>` : '') + '</div>');
  const b = document.querySelector(`.sug[data-o="${ex.order}"] [data-setkg]`);
  if (b) b.onclick = () => {
    let n = 0;
    rows.forEach(r => { if (!r.dataset.st) { r.querySelector('.kg').value = fmtKg(s.kg); n++; } });
    toast('Ustawiono ' + fmtKg(s.kg) + ' kg w ' + n + ' ' + plural(n, 'serii', 'seriach', 'seriach') + '.');
    updateSug(ex);
  };
}
/** „Ostatnio: 105 kg × 5 · RPE 9” (PROSTY: słownie) – z poprzedniej jednostki z tym ćwiczeniem */
function lastLine(ex){
  const t = lastTop(DATA ? DATA.logs : [], ex.name, cur.week, cur.day);
  if (!t) return '';
  const kg = typeof t.kg === 'number' ? fmtKg(t.kg) + ' kg' : esc(t.kg);
  const eff = isOly(ex) && RATE[t.ocena] ? ' · ' + RATE[t.ocena].label : blank(t.rpe) ? '' : SIMPLE ? ' · ' + (EFFORT.find(e => e[0] === effortVal(t.rpe)) || ['', ''])[1]
    : SCALE === 'RIR' ? ' · RIR ' + fmtKg(rirOfRpe(t.rpe)) : ' · RPE ' + fmtKg(t.rpe);
  return `<div class="last">Ostatnio: ${kg} × ${esc(t.reps)}${eff}</div>`;
}
function rxSimple(ex){
  const n = ex.sets, reps = String(ex.reps).trim(), r = parseInt(reps);
  const range = reps.match(/^(\d+)\s*[-–]\s*(\d+)$/);
  const repTxt = /^\d+$/.test(reps) ? `${r} ${plural(r, 'powtórzenie', 'powtórzenia', 'powtórzeń')}`
    : range ? `${range[1]}–${range[2]} ${plural(+range[2], 'powtórzenie', 'powtórzenia', 'powtórzeń')}` : esc(reps);
  return `${n} ${plural(n, 'seria', 'serie', 'serii')} po ${repTxt}` +
         (ex.kg !== '' ? ` · <b>${esc(fmtKg(ex.kg))}${typeof ex.kg === 'number' ? ' kg' : ''}</b>` : '') + (isOly(ex) ? maxToday(ex) : '');
}
function hintSimple(ex){
  if (typeof ex.rpe !== 'number' || ex.rpe >= 10) return '';
  const rir = Math.max(1, Math.round(10 - ex.rpe));

function readB64(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
}
function directPut(url, file, onProg){
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.upload.onprogress = e => { if (e.lengthComputable) onProg(e.loaded / e.total); };
    x.onload = () => {
      if (x.status === 200 || x.status === 201) {
        try { const f = JSON.parse(x.responseText); res({ id: f.id, link: f.webViewLink || ('https://drive.google.com/file/d/' + f.id + '/view') }); }
        catch (e) { rej(new Error('odpowiedź Drive nieczytelna')); }
      } else rej(new Error('Drive ' + x.status));
    };
    x.onerror = () => rej(new Error('direct-blocked'));
    x.send(file);
  });
}
async function relayUpload(meta, file, onProg){
  const init = await call('startUpload', meta);
  let start = 0, out = null;
  while (start < file.size) {
    const end = Math.min(start + init.chunk, file.size);
    const b64 = await readB64(file.slice(start, end));
    out = await call('uploadChunk', init.uploadId, b64, start, file.size);
    start = end; onProg(start / file.size);
  }
  return out;
}

/* ---------- śledzenie talerza na klatkach filmu: dopasowanie wzorca (SAD) na zmniejszonym szarym obrazie, co 1/30 s ---------- */
/**
 * src: { w, h, t0, t1, draw(ctx, t, W, H) → Promise } – klatka z chwili t narysowana na ctx (film albo obraz testowy)
 * c0: środek talerza, r0: promień [px filmu]; talerz 450 mm kalibruje skalę.
 * Wynik: [{t, x, y}] w metrach, y w górę, względem pierwszej klatki.
 */
async function track(src, c0, r0, onProg, abort){
  const k = Math.min(1, 28 / r0), rw = r0 * k, W = Math.round(src.w * k), H = Math.round(src.h * k);
  const wc = document.createElement('canvas'); wc.width = W; wc.height = H;
  const wx = wc.getContext('2d', { willReadFrequently: true });
  const th = Math.max(8, Math.round(rw * 0.75)), sr = Math.max(8, Math.round(rw * 0.7)), side = 2 * th + 1;
  const grey = img => { const d = img.data, g = new Float32Array(img.width * img.height); for (let i = 0, j = 0; i < d.length; i += 4, j++) g[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; return g; };
  let cx = c0.x * k, cy = c0.y * k, tpl = null;
  const pts = [], dt = 1 / 30;
  for (let t = src.t0; t <= src.t1 + 1e-6; t += dt) {
    if (abort && abort.stop) break;
    await src.draw(wx, t, W, H);
    const x0 = Math.max(0, Math.floor(cx - th - sr)), y0 = Math.max(0, Math.floor(cy - th - sr));
    const x1 = Math.min(W, Math.ceil(cx + th + sr + 1)), y1 = Math.min(H, Math.ceil(cy + th + sr + 1));
    const rg = x1 - x0, hg = y1 - y0;
    if (rg < side || hg < side) break;                                          // talerz wyszedł z kadru
    const g = grey(wx.getImageData(x0, y0, rg, hg));
    if (!tpl) {
      tpl = new Float32Array(side * side);
      const ox = Math.round(cx - th) - x0, oy = Math.round(cy - th) - y0;
      for (let j = 0; j < side; j++) for (let i = 0; i < side; i++) tpl[j * side + i] = g[(oy + j) * rg + ox + i];
      pts.push({ t, x: cx / k, y: cy / k });
      continue;
    }
    let best = Infinity, bx = 0, by = 0; const sc = {};
    for (let dy = -sr; dy <= sr; dy++) for (let dx = -sr; dx <= sr; dx++) {
      const ox = Math.round(cx - th + dx) - x0, oy = Math.round(cy - th + dy) - y0;
      if (ox < 0 || oy < 0 || ox + side > rg || oy + side > hg) continue;
      let s = 0;
      for (let j = 0; j < side && s < best; j += 2) { const ro = (oy + j) * rg + ox, to = j * side; for (let i = 0; i < side; i += 2) { const d = g[ro + i] - tpl[to + i]; s += d < 0 ? -d : d; } }
      sc[dx + ',' + dy] = s;
      if (s < best) { best = s; bx = dx; by = dy; }
    }
    // dokładność poniżej piksela: parabola przez sąsiednie wyniki
    const sub = (a, b, c) => { const den = a - 2 * b + c; return den > 0 ? 0.5 * (a - c) / den : 0; };
    const fx = sc[(bx - 1) + ',' + by] != null && sc[(bx + 1) + ',' + by] != null ? sub(sc[(bx - 1) + ',' + by], best, sc[(bx + 1) + ',' + by]) : 0;
    const fy = sc[bx + ',' + (by - 1)] != null && sc[bx + ',' + (by + 1)] != null ? sub(sc[bx + ',' + (by - 1)], best, sc[bx + ',' + (by + 1)]) : 0;
    cx = Math.round(cx) + bx + Math.max(-.5, Math.min(.5, fx)); cy = Math.round(cy) + by + Math.max(-.5, Math.min(.5, fy));
    const ox = Math.round(cx - th) - x0, oy = Math.round(cy - th) - y0;
    if (ox >= 0 && oy >= 0 && ox + side <= rg && oy + side <= hg)                 // wzorzec powoli nadąża za zmianą wyglądu talerza
      for (let j = 0; j < side; j++) for (let i = 0; i < side; i++) { const q = j * side + i; tpl[q] = 0.85 * tpl[q] + 0.15 * g[(oy + j) * rg + ox + i]; }
    pts.push({ t, x: cx / k, y: cy / k });
    if (onProg) onProg((t - src.t0) / (src.t1 - src.t0), cx / k, cy / k);
  }
  if (!pts.length) return [];
  const m = PLATE_M / (2 * r0);
  return pts.map(p => ({ t: p.t - pts[0].t, x: (p.x - pts[0].x) * m, y: -(p.y - pts[0].y) * m }));
}
/** film jako źródło klatek: przewinięcie do t i rysunek; analiza najwyżej 20 s od wybranego startu */
const videoSource = v => ({ w: v.videoWidth, h: v.videoHeight, t0: v.currentTime, t1: Math.min(v.duration, v.currentTime + 20),
  draw: (ctx, t, W, H) => new Promise(res => {
    let ok = false;
    const done = () => { if (ok) return; ok = true; v.removeEventListener('seeked', done); ctx.drawImage(v, 0, 0, W, H); res(); };
    v.addEventListener('seeked', done); v.currentTime = t; setTimeout(done, 1500);
  }) });

const fixDuration = v => new Promise(res => {
  if (isFinite(v.duration)) return res();
  const on = () => { if (isFinite(v.duration)) { v.removeEventListener('durationchange', on); res(); } };
  v.addEventListener('durationchange', on); v.currentTime = 1e101; setTimeout(res, 4000);
});

}
async function uploadVideo(ex, s0, file, row){
  const set = setKey(row.dataset.s), msg = t => { const m = $('#cam-msg'); if (m) { m.textContent = t; m.hidden = false; } };
  const prog = f => { const b = $('#cam-bar'); if (b) { b.style.display = 'block'; b.querySelector('i').style.width = Math.max(2, Math.round(100 * f)) + '%'; } };
  if (navigator.onLine === false) { msg(NO_NET); return; }
  prog(0); setSync('wgrywanie filmu…');
  const meta = { date: s0.date, day: cur.day, name: ex.name, set, fileName: file.name, mimeType: file.type || 'video/mp4', size: file.size };
  const t0 = Date.now();
  try {
    let out, mode = 'bezpośrednio';
    try {
      const init = await call('startUpload', Object.assign({ origin: location.origin }, meta));
      if (!init.url) throw new Error('direct-blocked');
      out = await directPut(init.url, file, prog);
    } catch (e) {
      if (e.message !== 'direct-blocked') throw e;
      mode = 'przez serwer'; prog(0);
      out = await relayUpload(meta, file, prog);
    }
    const p = Object.assign(payloadOf(row, ex, s0), { video: out.link,
      note: 'film ' + mode + ', ' + Math.round(file.size / 1048576) + ' MB, ' + Math.round((Date.now() - t0) / 1000) + ' s' });
    putLocal(ex, p); camMark(row, ex);
    send('logSet', p).catch(() => {});
    closeSheet(); toast('Film wgrany ' + mode + ' (seria ' + setLabel(set, row.dataset.k) + ').');
  } catch (e) {
    const b = $('#cam-bar'); if (b) b.style.display = 'none';
    const net = /Failed to fetch|NetworkError|Load failed/i.test(e.message);
    msg(net ? NO_NET : 'Nie udało się wgrać filmu: ' + e.message); setSync(net ? 'brak sieci – film niewysłany' : 'błąd filmu');
  }
}

load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
