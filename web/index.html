<!DOCTYPE html>

<head>

<title>Siła z Ruchu</title>
<meta name="theme-color" content="#0f1612" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#edf4f2" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- aplikacja ma własny jasny i ciemny motyw: bez tego Samsung / Chrome przyciemniają jasny motyw po swojemu (czarny nagłówek, szare karty) -->
<meta name="color-scheme" content="light dark">
<style>
  /* Czcionki lokalne (OFL, web/fonts/), też offline przez sw.js. Zakresy: łaciński + rozszerzony (polskie znaki). */
  @font-face{font-family:"Big Shoulders Display";font-weight:100 900;font-display:swap;src:url(fonts/big-shoulders-display-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"Big Shoulders Display";font-weight:100 900;font-display:swap;src:url(fonts/big-shoulders-display-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"Instrument Sans";font-weight:400 700;font-display:swap;src:url(fonts/instrument-sans-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"Instrument Sans";font-weight:400 700;font-display:swap;src:url(fonts/instrument-sans-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  /* Tokeny Pomost (docs/ui-v2-spec.md, „Paleta”). Kolory tylko przez te zmienne. */
  :root{--bg:#edf4f2;--surface:#ffffff;--surface-2:#e1eae6;--line:#c9d4cf;
        --ink:#17221c;--ink-2:#31473a;--muted:#5f6649;--olive:#7c8363;
        --primary:#31473a;--on-primary:#ffffff;--accent:#a9542a;--on-accent:#ffffff;
        --ok:#296c45;--warn:#8f5d0e;--bad:#b5483b;
        --panel:#17221c;--light-off:#38443d;--light-white:#f7f7f2;--light-red:#e5392d;--light-amber:#f0b54f;
        --e-g:#2f8a4f;--e-y:#d99a00;--e-r:#d23c2e;
        --p25:#c8372d;--p20:#2a5ea8;--p15:#d9ad1f;--p10:#3f8a4a;--p5:#f4f4f0;
        --h1:#9da783;--h2:#7c8363;--h3:#5d6447;--h4:#3f452e;
        --intro-bg:#17241d;--intro-ink:#f3f1e8;--intro-acc:#e0a34a;--intro-muted:#a3ab86;
        --f-display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
        --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
        --r:10px;--rc:18px;--gap:14px;--bar:#31473a;--bar-ink:#ffffff;--bar-muted:#cfdcd5;--bar-line:#4c6555;--shadow:0 1px 2px rgba(23,34,28,.06),0 4px 14px rgba(23,34,28,.05);
        color-scheme:light}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1612;--surface:#18221c;--surface-2:#223029;--line:#2f3f36;
          --ink:#edf4f2;--ink-2:#cfdcd5;--muted:#a3ab86;
          --primary:#c5cfa9;--on-primary:#0f1612;--accent:#e0a34a;--on-accent:#0f1612;
          --ok:#62b07a;--warn:#e0a34a;--bad:#e3826b;--e-g:#62b07a;--e-y:#f0b54f;--e-r:#ee5a4a;
          --panel:#050806;--light-off:#26302a;--h1:#535b3f;--h2:#747c59;--h3:#99a17a;--h4:#c5cfa9;--shadow:0 0 0 transparent;--bar:#2e4a3b;--bar-ink:#ffffff;--bar-muted:#cfdcd5;--bar-line:#4c6555;color-scheme:dark}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* bez powiększania dwoma palcami i podwójnym dotknięciem (26.11, prośba Damiana): przypadkowe powiększenie w trakcie treningu.
     Android: user-scalable=no w viewport (wyłącza je ustawienie „Wymuś powiększanie” w Chrome); iPhone ignoruje viewport, więc touch-action tutaj i gesturestart w JS. */
  html{touch-action:pan-x pan-y}
  [hidden]{display:none!important}                      /* atrybut hidden wygrywa z display:grid/flex */
  body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* nagłówek: tydzień · jednostka · data, tytuł, statystyki (czas, serie, tonaż) */
  header{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--accent);padding:10px 16px 12px}
  /* przewijanie w dół chowa nagłówek, w górę przywraca (skrypt: klasa .hid) */
  header{transition:transform .2s ease-out}
  header.hid{transform:translateY(-100%)}
  @media (prefers-reduced-motion:reduce){header{transition:none}}
  header .eyebrow,header #sync,header .stats span{color:var(--bar-muted)}
  header h1,header .stats b{color:var(--bar-ink)}
  header .stats span{border-left-color:var(--bar-line)}
  header .sc button{border-color:var(--bar-muted);color:var(--bar-muted)}
  header .sc button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
  header .tag{border-color:var(--bar-muted);color:var(--bar-ink)}
  .hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .eyebrow .logo{width:20px;height:20px;border-radius:5px;vertical-align:-5px;margin-right:8px;flex:none}
  .eyebrow{font:600 12px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  h1{margin:2px 0 0;font:800 25px/1.02 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink-2);
     display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #sync{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;flex:none}
  /* trening prowadzony przez trenera (?prowadz=): pasek w kolorze akcentu, „‹ Panel”, notatka trenera i „zmień plan” w karcie */
  .hr{display:flex;gap:10px;align-items:baseline;flex:none}
  #live-back{font:700 13px/1.2 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--bar-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;
    min-height:40px;padding:0 12px;border:2px solid var(--bar-ink);border-radius:var(--r);white-space:nowrap}
  #live-back.warn{background:var(--surface);color:var(--bad);border-radius:var(--r);padding:6px 8px}
  body.live header{--bar:var(--accent);--bar-ink:var(--on-accent);--bar-muted:var(--on-accent);--bar-line:var(--on-accent);border-bottom-color:var(--primary)}
  .tplan{margin-left:8px;border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:var(--r);padding:4px 8px;min-height:32px;font:600 13px var(--f-body);vertical-align:middle}
  .tnote{margin-top:12px;border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2)}
  .tn-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .tn-h b{font:600 12px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .seg2{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg2 button{border:0;background:transparent;padding:6px 12px;min-height:36px;font:600 13px var(--f-body);color:var(--ink);white-space:nowrap}
  .seg2 button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
  .tnote textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px 10px;font-size:15px;resize:vertical}
  .tn-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
  .tn-s{color:var(--muted);font-size:12px}
  .fx-nav .fx-add{flex:none;white-space:nowrap}
  label.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:14px;margin:4px 0 8px}
  label.chk input{width:22px;height:22px;flex:none}
  .stats{display:flex;flex-wrap:wrap;gap:4px 0;margin-top:6px}
  .stats:empty{display:none}
  .stats span{display:flex;align-items:baseline;gap:6px;padding:0 12px;border-left:1px solid var(--line);
              font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .stats span:first-child{padding-left:0;border-left:0}
  .stats b{font:700 22px/1 var(--f-display);letter-spacing:.02em;color:var(--ink);text-transform:none}
  .tag{border:1px solid var(--accent);color:var(--accent);padding:3px 6px;border-radius:var(--r)}
  .row{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);border-radius:0;
        padding:8px 12px 6px;min-height:44px;font:700 17px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
  .chip.on{color:var(--ink-2);border-bottom-color:var(--accent)}
  .chip small{display:block;font:500 12px/1.2 var(--f-mono);letter-spacing:0;text-transform:none}
  main{padding:6px 16px calc(104px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* dolne menu: zakładka aktywna = pasek akcentu u góry */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;
       background:var(--bar);border-top:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav button{flex:1 1 auto;position:relative;border:0;background:transparent;min-height:58px;display:grid;place-items:center;gap:2px;padding:6px 2px;
              font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--bar-muted)}
  .nav svg{width:22px;height:22px;box-sizing:content-box;padding:3px 16px;border-radius:999px;transition:background-color .15s}
  .nav button[aria-current="page"]{color:var(--bar-ink);font-weight:700}
  .nav button[aria-current="page"] svg{background:var(--accent);color:var(--on-accent)}        /* wybrana zakładka: kapsuła za ikoną */

  /* pasek tygodnia Pn–Nd: 7 kolumn ≥ 44 px także przy 360 px (siatka na całą szerokość karty) */
  .wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);box-shadow:var(--shadow);margin-top:10px;padding:6px 0 4px}
  .wk-h{display:flex;align-items:center;gap:4px;padding:0 6px}
  .wk-a{width:44px;height:44px;flex:none;border:0;background:transparent;color:var(--ink-2);font-size:16px;border-radius:var(--r)}
  .wk-t{flex:1;min-width:0;text-align:center;display:grid}
  .wk-t b{font:700 17px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wk-t small{font:500 12px/1.2 var(--f-mono);color:var(--muted)}
  .wk-now{flex:none;padding:6px 8px}
  .wk-a:disabled{opacity:.35}
  #pw-cn{width:100%;margin-top:var(--gap)}
  .wk-now[aria-pressed="true"]{border-color:var(--line);color:var(--muted)}
  .wk-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:4px 0 0;touch-action:pan-y}
  .wk-d{min-width:0;min-height:76px;border:1px solid transparent;border-radius:var(--r);background:transparent;color:var(--ink);padding:4px 0;
        display:flex;flex-direction:column;align-items:center;gap:2px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .wk-d.free{color:var(--muted);opacity:.55;cursor:default}
  .wk-d.now{border:2px solid var(--accent)}
  .wk-d.cur{background:var(--surface-2)}
  .wk-wd{font:600 12px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .wk-dd{font:700 20px/1 var(--f-display)}
  .wk-u{display:flex;align-items:center;gap:1px;font:600 12px/1.1 var(--f-mono);border-radius:6px;padding:2px 3px;background:var(--surface-2);color:var(--ink-2);max-width:100%;overflow:hidden}
  .wk-u i{font-style:normal;font-weight:700}
  .wk-u.st-done{background:var(--ok);color:var(--surface)}
  .wk-u.st-late{background:var(--bad);color:var(--surface)}
  .wk-u.st-today{background:var(--accent);color:var(--on-accent)}
  .wk-hint{margin:2px 8px 4px;font-size:12px;color:var(--muted);text-align:center}
  /* tryb skupienia: pasek „Ćwiczenie n z m” na górze, jedno ćwiczenie (albo obwód), pod nim „Następne”; reszta Treningu schowana klasą fx-off */
  .fx-off{display:none!important}
  .fx{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);box-shadow:var(--shadow);margin-top:10px;padding:6px 14px 12px}
  .fx-t{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .fx-t b{font-size:14px;color:var(--ink)}
  .fx-l{min-height:44px;border:0;background:none;font:600 14px var(--f-body);color:var(--accent);padding:0 2px 0 10px}
  .fx-seg{display:flex;gap:5px}
  .fx-seg i{flex:1;height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
  .fx-seg i.d{background:var(--ok);border-color:var(--ok)}
  .fx-seg i.c{background:var(--accent);border-color:var(--accent)}
  .fx-nav{display:flex;gap:10px;margin-top:var(--gap)}
  .fx-nav button{min-height:52px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font:600 15px var(--f-body);color:var(--ink);padding:0 16px}
  .fx-nav #fx-prev{min-width:52px}
  .fx-nav button:disabled{opacity:.4}
  .fx-nav .n{flex:1;min-width:0;background:var(--primary);color:var(--on-primary);border-color:var(--primary);text-align:left;line-height:1.2}
  .fx-nav .n small{display:block;font-weight:400;font-size:12px;opacity:.85}
  .fx-nav .n span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx-nav .b{flex:1}
  .card.fxc .fold-c{visibility:hidden}
  .fx + .card, .fx + .grp{margin-top:var(--gap)}
  /* przejście „karty w ręku”: fx-mv = karta kroku w ruchu (nad kopią starej), fx-gh = kopia starej karty albo sąsiedniej (fx-pk) przy przesuwaniu palcem */
  .fx-mv{position:relative;z-index:3;will-change:transform}
  .fx-gh{position:fixed!important;margin:0!important;pointer-events:none;will-change:transform,opacity}
  /* karta „dziś”: co dziś i ile to potrwa, przycisk do pierwszego niezrobionego ćwiczenia */
  /* w trakcie treningu (od 1. serii roboczej) karta „dziś”, pasek tygodnia i baner dyspozycji → jedna linia #wkm (punkt 9 v80) */
  .wkm{display:none}
  #main.slim #today,#main.slim .wk[data-wk="t"],#main.slim > .ready{display:none}
  #main.slim .wkm{display:flex;align-items:center;gap:8px;min-height:48px;margin-top:10px;padding:2px 2px 2px 14px;border-radius:var(--rc);background:var(--surface);border:1px solid var(--line);font:600 15px/1.2 var(--f-body);color:var(--ink)}
  .wkm .wd{font:800 17px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
  .wkm .mut{color:var(--ink-2);flex:1;min-width:0;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wkm .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
  .wkm .dot.lv-ok{background:var(--e-g)}.wkm .dot.lv-warn{background:var(--e-y)}.wkm .dot.lv-bad{background:var(--e-r)}
  .wkm button{min-width:44px;min-height:44px;border:0;background:transparent;color:var(--ink-2);font:700 18px var(--f-body);border-radius:var(--r)}
  .today{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);box-shadow:inset 5px 0 0 var(--accent),var(--shadow);margin-top:10px;padding:14px 16px 14px 20px}
  .td-row{display:flex;align-items:center;gap:12px}
  .td-row > div{flex:1;min-width:0}
  .td-row .btn.p{width:auto;flex:0 0 auto;padding:12px 18px;margin:0}
  .td-e{font:600 12px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .td-t{font:700 25px/1.02 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink)}
  .td-s{font-size:14px;color:var(--ink-2);margin-top:4px}
  .td-s b{color:var(--ink);white-space:nowrap}
  .td-pb{height:6px;border-radius:3px;background:var(--surface-2);margin-top:12px;overflow:hidden}
  .td-pb i{display:block;height:100%;background:var(--accent)}
  .td-n{font-size:13px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .td-n b{color:var(--ink-2);font-weight:600}
  .wk .offer{margin:6px 8px 4px}
  .mv-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .mv-g .lbl{padding:2px 0}
  .mv-d{min-height:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);display:grid;place-items:center;align-content:center;padding:2px 0;
        font:700 18px/1 var(--f-display)}
  .mv-d small{font:500 12px/1 var(--f-mono);color:var(--muted)}
  .mv-d.now{border:2px solid var(--accent)}
  .mv-d.on{background:var(--ink-2);color:var(--bg)}
  .mv-d.on small{color:var(--bg)}

  /* ekran Plan */
  .tabs{border-bottom:1px solid var(--line);margin:8px 0 0}
  .strip{display:flex;gap:4px;margin:10px 0 2px;overflow-x:auto;scrollbar-width:none}
  .dayb{flex:1 0 52px;min-height:64px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--ink);
        display:grid;justify-items:center;align-content:center;gap:2px;padding:4px}
  .dayb small{font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .dayb b{font:700 22px/1 var(--f-display)}
  .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--olive);display:block}
  .dayb.done .dot{background:var(--ok);border-color:var(--ok)}
  .dayb.today{border-color:var(--accent)}
  .dayb.today .dot{background:var(--accent);border-color:var(--accent)}
  .unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);box-shadow:var(--shadow);margin-top:var(--gap);padding:14px 16px}
  .unit.done{box-shadow:inset 4px 0 0 var(--ok),var(--shadow)}
  .unit.today{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent),var(--shadow)}
  .uh{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start}
  .dd b{display:block;font:800 34px/1 var(--f-display);color:var(--ink-2)}
  .dd small,.ut small{display:block;font:600 12px/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .ut{font-size:15px;color:var(--ink-2)}
  .ut strong{font:700 22px/1 var(--f-display);text-transform:uppercase;color:var(--ink);margin-right:4px}
  .unit details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font:600 12px/1.2 var(--f-body);
                        letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .unit ol{margin:0 0 6px;padding-left:22px}
  .unit li{padding:6px 0;border-bottom:1px solid var(--line)}
  .unit li > b{display:block;font-weight:600}
  .unit li span{font-size:14px;color:var(--ink-2)}
  .uact{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .uh .btn.cal{min-width:48px;min-height:48px;padding:0 10px}
  .uh .btn.cal .ic{width:22px;height:22px;vertical-align:-5px}
  .opts.act .opt i .ic{width:20px;height:20px;vertical-align:-4px}
  .kal-l{font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .fl+.seg,.seg+.fl{margin-top:12px}
  .kal-b{display:grid;gap:8px;margin-top:16px}
  .kal-n{margin-top:10px;font-size:13px}
  .btn.go{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .mvl{position:relative}
  .mvl input{position:absolute;inset:-1px;opacity:0;width:auto;height:auto;border:0;padding:0;cursor:pointer}
  .offer{margin-top:10px;background:var(--surface-2);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

  /* ćwiczenie = sekcja protokołu: linia 2 px nad nazwą, bez kart */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);box-shadow:var(--shadow);padding:16px;margin-top:var(--gap)}
  .card.k{border-color:var(--olive)}
  .ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .cn{font:700 25px/1.02 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink)}
  .badge{flex:0 0 auto;border-radius:var(--r);padding:3px 6px;font:600 12px/1.2 var(--f-mono);background:var(--surface-2);color:var(--muted)}
  .ch .badge{font:800 13px/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
  .badge.A{background:var(--primary);color:var(--on-primary)}
  .badge.B{background:transparent;border:1px solid var(--ink-2);color:var(--ink-2)}
  .badge.K{background:transparent;border:1px solid var(--olive);color:var(--muted)}
  .rx{margin:6px 0 4px;font-size:15px;color:var(--ink-2)}
  .rx b{font:500 16px var(--f-mono);color:var(--ink)}
  .rx .badge{display:inline-flex;align-items:center;gap:5px;vertical-align:1px}
  /* kolor talerza przy % 1RM: ≤60 biały, 61–70 zielony, 71–80 żółty, 81–90 niebieski, >90 czerwony */
  .zone{display:inline-block;width:11px;height:11px;border:1px solid var(--ink);border-radius:3px;flex:none}
  .zone.p5{background:var(--p5)}.zone.p10{background:var(--p10)}.zone.p15{background:var(--p15)}.zone.p20{background:var(--p20)}.zone.p25{background:var(--p25)}
  .last{font-size:13px;color:var(--muted);margin:2px 0 4px}
  /* „Ostatnio” jako przycisk do historii ćwiczenia */
  button.last{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;margin:0 0 0 -10px;border:0;background:none;font:400 13px var(--f-body);color:var(--ink-2);text-align:left;cursor:pointer}
  button.last span{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  button.last::after{content:'›';font:700 18px/1 var(--f-display);color:var(--accent)}
  .hx-r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .hx-r div{display:grid;gap:2px;min-width:0}
  .hx-r span{font-size:14px;color:var(--ink-2)}
  .hx-r small{font:500 13px var(--f-mono);color:var(--muted)}
  .hx-r b{font:500 15px var(--f-mono);color:var(--ink);white-space:nowrap;text-align:right}
  .hx-r b i{font-style:normal;font-size:13px;color:var(--muted)}
  /* przełącznik RPE / RIR w nagłówku */
  .trow{display:flex;align-items:flex-start;gap:8px}
  .trow h1{flex:1;min-width:0}
  .sc{display:flex;flex:none}
  .sc button{min-height:44px;min-width:48px;border:1px solid var(--ink-2);background:transparent;color:var(--muted);border-radius:0;
             font:600 12px/1 var(--f-body);letter-spacing:.06em}
  .sc button+button{border-left:0}
  .sc button:first-child,.seg button:first-child{border-radius:var(--r) 0 0 var(--r)}
  .sc button:last-child,.seg button:last-child{border-radius:0 var(--r) var(--r) 0}
  .sc button[aria-pressed="true"]{background:var(--ink-2);color:var(--bg)}
  .note{font-size:14px;font-style:italic;color:var(--ink-2);margin:6px 0 8px;border-left:2px solid var(--olive);padding:2px 0 2px 10px}
  .hint{font-size:14px;color:var(--warn);margin:2px 0 6px}

  /* serie = wiersze tabeli */
  .sets{display:grid;gap:0;margin-top:8px}
  .set{display:grid;grid-template-columns:44px 1fr 1fr 62px 44px 44px;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
  .set:last-child{border-bottom:0}
  .set.simple{grid-template-columns:44px 1fr 1fr 80px 44px 44px;gap:5px}
  .set.set-head{border-bottom:1px solid var(--ink-2);padding:0 0 6px;margin-top:10px}
  .set .n{position:relative;min-height:44px;display:flex;align-items:center;justify-content:center;
          font:700 21px/1 var(--f-display);color:var(--ink)}
  input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);padding:9px 8px;font-size:16px}
  .set input,.set select{height:44px;border:0;background:transparent;text-align:center;padding:0 2px;min-width:0;
                         font:700 23px/1 var(--f-display);letter-spacing:.01em}
  .set select{appearance:none;-webkit-appearance:none;font-size:20px;text-align-last:center}
  .set.simple select{font:600 15px var(--f-body)}
  .set input::placeholder{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:1}
  .set:not(.set-head) > .lbl{font-size:12px;letter-spacing:0;text-transform:none}
  .set input:focus,.set select:focus{background:var(--surface-2)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .lbl{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
  .ok{height:44px;border-radius:var(--r);border:2px solid var(--ink-2);background:transparent;color:var(--line);font:700 20px/1 var(--f-body);padding:0}
  .set[data-st="ok"] .ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
  .set[data-st="x"] .ok{background:var(--bad);border-color:var(--bad);color:var(--surface)}
  .ok.pend{background:var(--warn);border-color:var(--warn);color:var(--surface)}
  @keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
  .ok.pop{animation:pop .26s ease-out}
  .card.folding{overflow:hidden}
  @media (prefers-reduced-motion:reduce){.ok.pop{animation:none}}
  /* numer serii jako przycisk typu: zwykła / drop / nieudana */
  .nt{width:100%;min-height:44px;border:0;background:transparent;padding:0;display:grid;place-items:center;align-content:center;
      font:700 21px/1 var(--f-display);color:var(--ink)}
  .nt small{font:600 12px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase}
  .set.t-d .nt{color:var(--accent)}
  .set.t-d .nt small::after{content:"drop"}
  .set[data-st="x"] .nt{color:var(--bad)}
  .set[data-st="x"] .nt small::after{content:"fail"}
  .set.k-w .n{color:var(--olive);font-size:17px}
  .set.k-w input{color:var(--muted)}
  .set.k-x .n{color:var(--ink-2)}
  .set.k-d .n{color:var(--accent);font-size:17px}
  .set.fail .kg,.set.fail .reps{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
  /* ✕ przy ostatnim dodanym wierszu: cała komórka numeru to cel dotyku 44 px */
  .del{position:absolute;inset:0;border:0;background:transparent;color:var(--bad);padding:2px;
       display:flex;align-items:flex-end;justify-content:flex-end;font:700 12px/1 var(--f-body)}
  .del.arm{background:var(--bad);color:var(--surface);align-items:center;justify-content:center;border-radius:var(--r)}

  .btn{border:1px solid var(--ink-2);background:transparent;color:var(--ink-2);border-radius:var(--r);padding:10px 12px;min-height:44px;
       font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center}
  .btn.p{background:var(--primary);border-color:var(--primary);color:var(--on-primary);width:100%;padding:12px;
         font:800 22px/1 var(--f-display);letter-spacing:.06em}
  .tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .btn.sm{padding:8px 10px}
  .btn.sm.x,.btn.x{border-color:var(--accent);color:var(--accent)}
  .btn.sm.d{border-color:var(--accent);color:var(--accent);border-style:dashed}
  .btn.all{width:100%;margin-top:8px;border-color:var(--ok);color:var(--ok);border-width:2px}
  .bar{height:3px;background:var(--surface-2);flex:1 1 120px;overflow:hidden;display:none}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  /* kamera przy serii: obrys = brak, wypełniona akcentem = jest film albo prędkość */
  .cam{height:44px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
  .cam svg{width:22px;height:22px}
  .cam.has{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .ghost{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:1px dashed var(--line);border-radius:var(--r);background:transparent;
         color:var(--muted);font:600 13px/1.2 var(--f-body);letter-spacing:.04em;padding:0 12px;text-align:left}
  .ghost small{font:500 12px/1 var(--f-mono);letter-spacing:0;color:var(--muted)}
  .ghost.d{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  /* v4: dodawanie wierszy w jednym rzędzie pod seriami; zużyty limit „+ seria” = wyszarzony */
  .adds{display:flex;gap:6px;margin-top:6px}
  .wu{display:flex;align-items:center;gap:8px;margin:2px 0 8px;padding:6px 6px 6px 12px;border-radius:var(--r);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
  .wu[hidden]{display:none}
  .wu .wu-t{flex:1 1 auto;min-width:0;font-size:13px;color:var(--ink-2);line-height:1.35}
  .wu .wu-t b{display:block;font:600 12px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .wu .wu-s{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:2px}
  .wu .wu-s span{font:500 14px var(--f-mono);color:var(--ink);white-space:nowrap}
  .wu .btn.sm{flex:0 0 auto;width:auto;min-height:44px;padding:0 14px}
  .adds .ghost{flex:1 1 auto;width:auto;justify-content:center;padding:0 6px;white-space:nowrap;text-align:center}
  .ghost:disabled{opacity:.45}
  .kgb{display:inline-flex;align-items:center;min-height:44px;border:0;border-radius:0;background:transparent;padding:0 2px;margin:-10px 0;
       font:500 16px var(--f-mono);color:var(--ink);text-decoration:underline dotted 1.5px;text-underline-offset:4px}
  /* v4: nazwa po lewej, stała kolumna ikon po prawej (film, więcej, zwiń) – zawsze w tym samym miejscu */
  .ch{align-items:flex-start;gap:4px}
  /* v39: etykieta priorytetu bez własnego rzędu: zwinięta karta = w linii z wynikiem, otwarta = na początku recepty */
  .ft .cn{flex:1 0 100%}
  .card:not(.fold):not(.skip) .ft .badge{display:none}
  .rx .badge.bp{font:800 13px/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin-right:6px;vertical-align:2px}
  .acts{flex:none;display:flex;margin:-4px -12px 0 0}
  .infb,.more,.fold-c{flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center;padding:0;border-radius:var(--r)}
  .infb svg,.more svg{width:22px;height:22px;display:block}
  .fold-c{width:44px;margin-left:-6px}
  .opts.act .opt{display:flex;align-items:center;gap:12px;min-height:52px;font-size:16px;text-decoration:none}
  .opts.act .opt i{flex:none;width:24px;text-align:center;font-style:normal;color:var(--muted)}
  .opts.act .opt small{margin-left:auto;color:var(--muted);font-size:13px}
  .opts.act .opt.warnopt,.opts.act .opt.warnopt i{color:var(--bad)}
  #np .opt{display:grid;grid-template-columns:24px 1fr;column-gap:12px;row-gap:2px;padding:10px 12px}#np .opt i{grid-row:span 2;align-self:center}#np .opt b{font-weight:600}#np .opt small{margin-left:0}
  .btn.bad{background:var(--bad);border-color:var(--bad);color:var(--surface);width:100%;padding:12px;font:800 20px/1 var(--f-display);letter-spacing:.06em;margin:14px 0 8px}
  .btn.wide{width:100%}
  .fold-b{flex:1;min-width:0;min-height:44px;border:0;background:transparent;padding:0;text-align:left;display:flex;align-items:flex-start;gap:10px;color:inherit}
  .ft{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
  .chev{flex:none;width:10px;height:10px;margin:5px 0 0;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-135deg);transition:transform .2s}
  .fsum{font:500 13px/1.2 var(--f-mono);color:var(--muted);display:none}
  .card.fold .cbody{display:none}
  .card.fold .fsum{display:block}
  .card.fold .chev{transform:rotate(45deg);margin-top:-5px}
  .card.fold{padding-top:10px;padding-bottom:10px}
  /* propozycja z planu albo z poprzedniej serii = szary placeholder; wpisana wartość = pełny kolor (do Logu idzie faktyczna) */
  .set input.ph::placeholder{font:700 23px/1 var(--f-display);letter-spacing:.01em;text-transform:none;color:var(--muted);opacity:1}
  .step{display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;gap:6px;align-items:center;margin:2px 0 6px;padding:6px;border-radius:var(--r);background:var(--surface-2)}
  .step button{min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:600 15px/1 var(--f-mono);touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .step b{text-align:center;font:700 22px/1 var(--f-display);color:var(--ink)}
  .ghost.own-new{justify-content:center;margin-top:var(--gap);min-height:52px;font-size:14px}
  .ghost.own-add{justify-content:center;margin-top:var(--gap)}
  .ow-res{display:grid;gap:6px;margin:6px 0 10px}
  .ow-res .opt{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ow-f{font:500 12px/1 var(--f-mono);color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:2px 7px}
  .ow-new{border-style:dashed;color:var(--accent)}
  .ow-n{display:flex;flex-direction:column;gap:3px;text-align:left}
  .ow-a{font:400 12px/1.3 var(--f-body);color:var(--muted)}
  .opt[aria-pressed="true"] .ow-a{color:inherit;opacity:.85}
  .ow-h{margin-top:6px}
  .pk-l{margin-top:12px}
  .pk-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 8px}
  .pk-t{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:64px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
  .pk-t b{font:800 21px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
  .pk-t small{color:var(--muted);font-size:13px}
  .pk-t small i{font-style:normal;color:var(--accent)}
  .pk-h{display:flex;align-items:center;gap:10px;margin:8px 0 6px}
  .pk-h .btn.sm{flex:none;width:auto;min-height:44px;padding:0 12px;margin:0}
  .pk-h b{flex:1;font:800 22px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
  .pk-h small{color:var(--muted);font-size:13px}
  .pk-ch{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:4px -2px 2px;padding:0 2px 4px}
  .pk-ch::-webkit-scrollbar{display:none}
  .pk-ch button{flex:none;min-height:44px;padding:0 12px;border:1px solid var(--ink-2);border-radius:var(--r);background:transparent;color:var(--ink-2);font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
  .pk-ch button[aria-pressed="true"]{background:var(--ink-2);color:var(--bg)}
  .pk-ch .pk-fl{border-style:dashed}
  .pk-s{margin:10px 0 2px}
  .pk-r{display:flex;align-items:stretch;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
  .pk-r.open{border-color:var(--accent)}
  .pk-n{flex:1;min-width:0;min-height:52px;padding:8px 12px;text-align:left;background:transparent;border:0;color:var(--ink);font:inherit;cursor:pointer}
  .pk-n b{display:block;font-weight:600;font-size:16px;line-height:1.25}
  .pk-n small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .pk-n[aria-pressed="true"]{background:var(--ink-2);color:var(--bg)}
  .pk-n[aria-pressed="true"] small{color:inherit;opacity:.85}
  .pk-v{flex:none;width:56px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--accent);font:600 12px/1.1 var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;cursor:pointer}
  .pk-v span{font-size:18px}
  .pk-v.off{color:var(--muted);cursor:default}
  .pk-pv{flex-basis:100%;border-top:1px solid var(--line);padding:10px 12px 12px}
  .pk-pv .btn{margin:4px 0 0}
  .pk-more{min-height:44px;border:1px dashed var(--line);border-radius:var(--r);background:transparent;color:var(--ink-2);font:600 14px var(--f-body);cursor:pointer}

  .grp-h span{font-size:13px;color:var(--ink-2);text-align:right}
  .grp-now{margin:0 2px 8px;padding:10px 12px;border-radius:var(--r);background:var(--surface-2);font-size:14px;color:var(--ink)}

  .gl{flex:none;align-self:flex-start;font:700 25px/1.02 var(--f-display);color:var(--accent)}
  .set.nowrow{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r)}
  .ow-grp{border:2px solid var(--accent);border-radius:var(--rc);padding:4px 10px;margin:8px 0}

  .ow-grp .ow-gh b{flex:1;color:var(--accent);font:700 14px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
  .ow-grp .ow-gh label{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
  .ow-grp .ow-gh input{width:54px;height:44px;text-align:center;padding:0 4px}
  .ow-grp .ow-it:last-child{border-bottom:0}
  .ow-it.in{grid-template-columns:1fr 64px 64px 44px}
  .ow-ch{grid-column:1 / -1;display:grid;gap:6px;padding:8px;border-radius:var(--r);background:var(--surface-2)}
  .ow-ch .opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .ow-it .ow-row{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .ow-nm{grid-column:1 / -1;display:flex;align-items:center;gap:6px}
  .ow-nm b{flex:1;min-width:0;overflow-wrap:anywhere}
  .ow-nm .ow-ni{flex:1;min-width:0;height:44px;text-align:left;padding:0 10px}
  .ow-mv{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--ink-2);font-size:18px;line-height:1}
  .ow-mv:disabled{opacity:.35}
  .ow-ed{font-size:16px}
  .ow-gh.k b{flex-basis:100%}
  .ow-mvs{margin-left:auto;display:flex;gap:6px}
  .ow-it.ord{display:block}
  .ow-it.ord small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .ow-it.ord .lk{color:var(--muted);font-size:13px;flex:none}
  .ow-it .ow-tag{font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:4px 8px}
  .ow-tm{min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--ink-2);font-size:13px}

  .ow-it{display:grid;grid-template-columns:1fr 54px 64px 64px 44px;gap:6px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
  .ow-it b{grid-column:1 / -1;font-weight:600}
  .ow-it label{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:grid;gap:3px}
  .ow-it input{height:44px;text-align:center;padding:0 4px}
  .ow-it .ow-rm{width:44px;height:44px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--muted)}
  .ow-it.old{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}

  .cam.pend{border:2px dashed var(--accent);color:var(--accent);background:transparent}
  .vq{border-left:4px solid var(--accent);padding:4px 0 4px 10px;margin:8px 0;font-size:15px}

  /* analiza ścieżki i VBT */
  .vbox{background:var(--panel);display:grid;place-items:center;border-radius:var(--r);overflow:hidden}
  .vbox canvas{max-width:100%;max-height:52vh;width:auto;height:auto;display:block;touch-action:manipulation}   /* pionowy film nie spycha wyników poza ekran */
  .scrub{min-height:44px;padding:0;border:0;background:transparent;accent-color:var(--accent)}
  .metrics{display:flex;gap:0;margin:4px 0}

  .metric:first-child{padding-left:0;border-left:0}
  .metric span{font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  /* podsumowanie jednostki */
  .sess .cn{margin-bottom:4px}
  /* pakiet treningów: odhaczenie w podsumowaniu prowadzonego treningu, licznik klienta */
  .pkt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;margin-top:16px;padding:12px 14px;min-height:64px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);color:var(--ink);text-align:left;font:15px/1.3 var(--f-body);cursor:pointer}

  .pkt.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}.pkt.on .bx{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
  .pkt.over .pkt-n{color:var(--bad)}

  .pkt-n{font:800 26px/1 var(--f-display)}.pkt-n i{font-style:normal;font-size:16px;color:var(--ink-2)}
  .pkt-no{margin:14px 0 0;color:var(--ink-2);font-size:13px}
  .pkc-c .pkn{display:flex;align-items:center;gap:12px;margin:6px 0 10px}.pkc-c .pkn b{font:800 52px/1 var(--f-display);color:var(--accent)}.pkc-c .pkn span{color:var(--ink-2);font-size:15px;line-height:1.35}
  .pkc-c .pkc{display:grid;grid-template-columns:repeat(auto-fill,minmax(20px,1fr));gap:4px}.pkc-c .pkc i{height:14px;border-radius:3px;background:var(--accent)}.pkc-c .pkc i.u{background:var(--surface-2);border:1px solid var(--line)}
  .sess label{display:block;margin:14px 0 6px;font:600 12px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  details.opt{margin-top:14px;border-top:1px dashed var(--line);padding:4px 0}
  details.opt summary{font-size:15px;padding:10px 0;min-height:44px;color:var(--ink-2);cursor:pointer}
  details.opt label{margin-top:8px}
  details.help{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);box-shadow:var(--shadow);padding:6px 16px;margin-top:var(--gap)}
  details.help summary{font:700 20px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink-2);cursor:pointer;min-height:44px;display:flex;align-items:center}
  details.help ol{margin:8px 0 2px;padding-left:20px;font-size:14px}
  details.help li{margin-bottom:6px}
  .timebox{display:flex;align-items:baseline;gap:12px;background:var(--panel);color:var(--light-white);border-radius:var(--r);padding:10px 12px}
  .timebox .clock{font:800 34px/1 var(--f-display);letter-spacing:.04em;color:var(--light-amber);font-variant-numeric:tabular-nums}
  #t-reset{margin-top:8px}
  .sess .fl{margin-top:10px}
  .sess .fl input{font:400 17px/1.3 var(--f-body)}
  .timebox small{color:var(--light-white);opacity:.8;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  #toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);color:var(--light-white);
         border-left:4px solid var(--light-amber);padding:10px 16px;border-radius:var(--r);font-size:15px;display:none;z-index:30;max-width:calc(100% - 32px)}
  .scale{display:grid;gap:4px;margin-top:4px}
  .scale.s5{grid-template-columns:repeat(5,1fr)}
  .scale.s11{grid-template-columns:repeat(6,1fr)}
  .pv{height:46px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 22px/1 var(--f-display)}
  .pv.on.n{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

  .pls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}

      font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase}

  .empty{color:var(--muted);text-align:center;padding:40px 0}

  .es{display:grid;justify-items:center;text-align:center;gap:8px;padding:28px 20px}

  .es .sub{margin:0;font-size:14px;max-width:30ch}

  .askkey{margin-top:24px}.askkey .btn{width:100%;margin-top:6px}

  /* postęp: wykresy (jedna seria, siatka z cienkich linii, wartości tekstem w kolorze tekstu) */
  svg.chart{width:100%;height:auto;display:block;margin-top:8px}

  .h1{background:var(--h1);border-color:var(--h1)!important}.h2{background:var(--h2);border-color:var(--h2)!important}
  .h3{background:var(--h3);border-color:var(--h3)!important}.h4{background:var(--h4);border-color:var(--h4)!important}

  /* dyspozycja dnia: baner na treningu, werdykt, ankieta, skoki. Poziomy jako lv-* (klasa .ok to przycisk ✓ z wysokością 44 px) */
  .ready{width:100%;margin-top:var(--gap);border:1px solid var(--line);border-radius:var(--rc);box-shadow:inset 5px 0 0 var(--muted),var(--shadow);background:var(--surface);padding:14px 16px 14px 20px;color:var(--ink-2);text-align:left;
         padding:8px 0 8px 12px;min-height:44px;display:grid;gap:2px;font-size:14px}

  .ready.lv-ok{box-shadow:inset 5px 0 0 var(--ok),var(--shadow)}.ready.lv-warn{box-shadow:inset 5px 0 0 var(--warn),var(--shadow)}.ready.lv-bad{box-shadow:inset 5px 0 0 var(--bad),var(--shadow)}
  .verdict{margin-top:var(--gap);background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);box-shadow:inset 6px 0 0 var(--muted),var(--shadow);padding:14px 16px 14px 22px}
  .verdict.lv-ok{box-shadow:inset 6px 0 0 var(--ok),var(--shadow)}.verdict.lv-warn{box-shadow:inset 6px 0 0 var(--warn),var(--shadow)}.verdict.lv-bad{box-shadow:inset 6px 0 0 var(--bad),var(--shadow)}

  .rhist .kv{flex-wrap:wrap}

  .stan .st-e{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

  .cia .cia-d{margin-top:12px}.cia .cia-d input{font:600 17px var(--f-body)}
  .cia .cia-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}
  .cia .cia-g input{width:100%;min-width:0}
  .cia-p{display:flex;flex-wrap:wrap;gap:8px}.cia-o{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.35}
  .cia-o b{font-weight:600}.cia-o i{font-style:normal;font:600 13px var(--f-mono);color:var(--muted)}
  .stan .st-list{margin-top:14px}
  .stan .st-list .lbl{margin-bottom:4px;text-align:left}
  .stan .st-r{align-items:center;gap:8px}

  .cmj-how p{margin:0 0 4px;font-size:14px}
  .cmj-exs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  svg.cmj-ex{width:100%;height:auto;background:var(--surface-2);border-radius:var(--r)}
  svg.cmj-ex .g{stroke:var(--ink-2);stroke-width:2}
  svg.cmj-ex .f{fill:var(--olive)}
  svg.cmj-ex .m{stroke:var(--accent);fill:var(--accent);stroke-width:2}
  .cmj-f{margin:0;display:grid;gap:3px}

  .det{margin:0;font-size:15px}
  .verdict li i{font-style:normal;font-weight:700;display:inline-block;width:1.2em}
  .verdict li.lv-ok i{color:var(--ok)}.verdict li.lv-warn i{color:var(--warn)}.verdict li.lv-bad i{color:var(--bad)}
  .verdict p{margin:0;color:var(--ink-2)}
  .scale.s7{grid-template-columns:repeat(7,1fr)}
  .card .scale.s7{margin-left:-10px;margin-right:-10px;gap:3px}                /* 7 przycisków po ≥ 44 px także w karcie */
  .q{margin-top:12px}
  .jumps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
  .jumps input{text-align:center}
  .kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2)}
  .kv b{font:500 15px var(--f-mono);color:var(--ink)}
  #dysp .card .btn{margin-top:10px}
  #dysp > .btn.p{margin-top:18px}
  .vbox video{display:block;max-width:100%;max-height:52vh}
  .fl select{min-height:48px;font:400 16px var(--f-body);text-transform:none;letter-spacing:0}

  /* notatka trenera do jednostki (Plan.uwagi_jedn) nad treningiem */
  .unote{background:var(--surface);border-radius:var(--rc);box-shadow:inset 5px 0 0 var(--accent),var(--shadow);padding:12px 16px 14px 20px;margin-top:var(--gap)}
  .unote h3{margin:0;font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .unote p{margin:6px 0 0;font:500 16px/1.45 var(--f-body);color:var(--ink);white-space:pre-line;overflow-wrap:anywhere}
  /* Postęp → Blok: notatka trenera do bloku (Bloki.dla_klienta) */
  .bl-note{margin:6px 0 0;font:500 16px/1.45 var(--f-body);color:var(--ink);border-left:3px solid var(--accent);padding:2px 0 2px 10px;white-space:pre-line;overflow-wrap:anywhere}
  .card .dn-t{margin-top:10px}
  /* zamiana ćwiczenia */
  .cnote{background:var(--surface);border:1px solid var(--accent);border-radius:var(--rc);box-shadow:inset 5px 0 0 var(--accent),var(--shadow);padding:14px 16px 16px 20px;margin-top:var(--gap)}
  .cnote h3{margin:0 0 6px;font:800 22px/1.1 var(--f-display);text-transform:uppercase;color:var(--ink-2)}
  .cn-l{list-style:none;margin:0 0 10px;padding:0}
  .cn-l li{margin:0 0 10px}
  .cn-h{display:block;font-size:14px;font-weight:600;color:var(--ink-2)}
  .cn-l p{margin:2px 0 0;font-size:16px;line-height:1.4}
  .cn-t{font-family:var(--f-mono);font-weight:600}
  .cn-s{font-size:14px;color:var(--ink-2);margin:0 0 10px}
  .cn-hr{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cn-hr .cn-h{flex:1 1 auto;min-width:0}
  .cn-fb{flex:0 0 auto;min-height:44px;padding:0 14px;font-weight:600;border-color:var(--accent);color:var(--accent)}
  .cn-tb{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;margin:2px 4px 2px 0;border:1px solid var(--accent);border-radius:var(--r);background:none;color:var(--accent);font-size:15px;cursor:pointer;vertical-align:baseline}
  /* odtwarzacz filmu z komentarza (openFilm) */
  .fv-box{background:var(--surface-2);border-radius:var(--r);overflow:hidden;min-height:180px;display:flex;align-items:center;justify-content:center}
  .fv-box video{display:block;width:100%;max-height:52vh;background:var(--surface-2)}
  .fv-ld{padding:24px 16px;text-align:center;color:var(--ink);font-size:15px;width:100%}
  .fv-ld i{display:block;height:6px;border-radius:3px;background:var(--line);margin:12px auto 0;max-width:260px;overflow:hidden}
  .fv-ld b{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .fv-sp{display:flex;align-items:center;gap:6px;margin:10px 0 0}
  .fv-sp span{font-size:14px;color:var(--ink-2);margin-right:auto}
  .fv-sp .btn{min-height:44px;min-width:52px}
  .fv-sp .btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .fv-l{margin:10px 0 12px}
  .fv-m{display:flex;gap:10px;align-items:baseline;width:100%;min-height:44px;padding:10px 12px;margin:0 0 6px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:500 16px/1.35 var(--f-body);cursor:pointer}
  .fv-m .cn-t{color:var(--accent);flex:0 0 auto}
  .fv-m.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
  .fv-p{margin:0 0 8px;font-size:16px;line-height:1.4}
  .cnote .row{display:flex;gap:8px;flex-wrap:wrap}
  .cnote .row .btn{flex:1 1 140px}
  /* zakładka Trener: tydzień = karta, starsze zwinięte; nowy komentarz z paskiem akcentu */
  details.cw > summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  details.cw > summary::-webkit-details-marker{display:none}
  details.cw > summary::after{content:'';width:9px;height:9px;border:solid var(--ink-2);border-width:0 2px 2px 0;transform:rotate(45deg);margin:-4px 4px 0 0;flex:0 0 auto}
  details.cw[open] > summary::after{transform:rotate(225deg);margin-top:4px}
  .cw .cn{display:block}
  .cw .sub{margin:0}
  .cw-u{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line);font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .cw .cn-l{margin:6px 0 0}
  .cw .cn-l li{padding:6px 0 6px 12px;margin:0;box-shadow:inset 3px 0 0 var(--line)}
  .cw .cn-l li.new{box-shadow:inset 3px 0 0 var(--accent)}
  .cw-new{font:600 12px/1 var(--f-mono);letter-spacing:.04em;background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:3px 6px;margin-left:6px;vertical-align:1px}
  .nav i.nd{position:absolute;top:6px;left:calc(50% + 12px);width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bar)}
  #cn-all{margin:12px 0 0}
  /* odpowiedź klienta na komentarz trenera: pod komentarzem, wcięta, z kreską w kolorze tekstu */
  .cn-rep{margin:8px 0 0}
  .cn-rb{min-height:44px;padding:8px 12px}
  .cn-my{margin:0;padding:6px 0 6px 10px;border-left:3px solid var(--ink-2)}
  .cn-mh{display:block;font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .cn-my p{margin:2px 0 0;white-space:pre-line;overflow-wrap:anywhere}
  .cn-my .lnk{background:none;border:0;padding:6px 12px 0 0;min-height:44px;min-width:56px;text-align:left;color:var(--accent);font:600 14px/1 var(--f-body);text-decoration:underline;text-underline-offset:3px}
  .cn-ed textarea{min-height:88px;resize:vertical}
  .cn-ed .row{display:flex;gap:8px;margin-top:8px}
  .cn-ed .row .btn{flex:1 1 0}
  .cn-ed .btn.go{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .cn-ed .cnt{display:block;text-align:right;font-size:12px;color:var(--ink-2);margin-top:4px}
  a.btn{text-decoration:none}
  /* serie twarde na partię: jedna seria danych, kreska = średnia z 4 tygodni */
  .hp{display:grid;grid-template-columns:92px 1fr 28px 58px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2)}
  .hp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
  .hpb{position:relative;height:12px;background:var(--surface-2)}
  .hpb i{display:block;height:100%;background:var(--olive)}
  .hpb u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .hp b{font:500 15px var(--f-mono);color:var(--ink);text-align:right}
  .hp small{font-size:12px;color:var(--muted)}
  .swapped{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;font-size:14px;color:var(--ink-2);border-left:4px solid var(--accent);padding:2px 0 2px 10px}
  .opts{display:grid;gap:4px}
  .opts.why{grid-template-columns:1fr 1fr}
  .opt{min-height:48px;border:1px solid var(--ink-2);border-radius:var(--r);background:transparent;color:var(--ink);text-align:left;padding:8px 12px;font-size:15px}
  .opt[aria-pressed="true"]{background:var(--ink-2);color:var(--bg)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* wysiłek serii = światło (lib EFF): przycisk w wierszu i wybór pod wierszem */
  .ef{min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--ink);display:grid;justify-items:center;align-content:center;gap:3px;padding:2px 4px;min-width:0}
  .ef .d,.efp .d{display:block;border-radius:50%}
  .ef .d{width:14px;height:14px;box-shadow:inset 0 0 0 2px var(--muted)}
  .ef .d.g,.efp .d.g{background:var(--e-g);box-shadow:none}.ef .d.y,.efp .d.y{background:var(--e-y);box-shadow:none}.ef .d.r,.efp .d.r{background:var(--e-r);box-shadow:none}
  .ef .d.x{box-shadow:none;color:var(--bad);font:900 15px/14px var(--f-body);text-align:center;font-style:normal}
  .ef b{font:700 16px/1 var(--f-display)}
  .set.simple .ef b{font:600 13px/1 var(--f-body)}
  .ef small{font:600 12px/1 var(--f-body);letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
  .ef.open{outline:2px solid var(--accent);outline-offset:-2px}
  .efp{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
  .efp > button{min-height:60px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);color:var(--ink);display:grid;grid-template-columns:22px 1fr;column-gap:8px;align-items:center;text-align:left;padding:6px 10px}
  .efp > button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-3px}
  .efp .d{grid-row:span 2;width:20px;height:20px}
  .efp .d.x{color:var(--bad);font:900 20px/20px var(--f-body);text-align:center;font-style:normal}
  .efp b{font:700 17px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
  .efp small{font-size:12px;color:var(--ink-2);line-height:1.25}
  .efp .rclr{grid-column:1/-1;min-height:44px;display:block;text-align:center;background:transparent;color:var(--ink-2)}
  .efp .fine,.rate .fine{grid-column:1/-1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:600 13px var(--f-body);color:var(--ink-2)}
  .efp .fine .fe,.rate .fine .fe{flex-basis:100%;font:500 12px var(--f-body);color:var(--muted)}
  .efp .fine button,.rate .fine button{min-width:52px;min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:700 17px var(--f-display)}
  .efp .fine button[aria-pressed="true"],.rate .fine button[aria-pressed="true"]{background:var(--ink-2);color:var(--bg)}
  /* boje: światła sędziowskie, wybór oceny, propozycja ciężaru */
  .set .lt,.set-head .hl2{grid-column:span 2}
  .lt{min-height:44px;border:0;border-radius:var(--r);background:var(--panel);color:var(--light-white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;min-width:0}   /* światła nad napisem: obok siebie „ŚREDNIO” / „SPALONE” nie mieściły się w kolumnie (v95) */
  .lt small{font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;max-width:100%}
  .lt.pend{outline:3px solid var(--warn);outline-offset:-3px}
  .lights{display:inline-flex;gap:4px}
  .lights i{width:14px;height:14px;border-radius:50%;background:var(--light-off);display:block}
  .lights i.w{background:var(--light-white)}
  .lights i.r{background:var(--light-red)}
  .rec{display:flex;align-items:center;gap:8px;padding:2px 0 8px;border-bottom:1px solid var(--line);font:600 14px/1.3 var(--f-body);color:var(--ink-2)}
  .rec b{flex:none;font:700 13px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:5px 8px;border-radius:999px}
  .rec.first b{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .set.isrec{border-bottom:0}
  .rate{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px 0;border-bottom:1px solid var(--line)}
  .rate button{min-height:56px;border:1px solid var(--light-off);border-radius:var(--r);background:var(--panel);color:var(--light-white);
               display:grid;justify-items:center;align-content:center;gap:3px;padding:6px}
  .rate button[aria-pressed="true"]{outline:3px solid var(--light-amber);outline-offset:-3px}
  .rate b{font:700 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
  .rate small{font-size:12px;opacity:.85}
  .rate .rclr{grid-column:1/-1;min-height:44px;background:transparent;color:var(--ink-2);border-color:var(--line)}
  .sug{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-left:4px solid var(--muted);padding:6px 0 6px 10px;margin:6px 0;font-size:14px}
  .sug.up{border-left-color:var(--ok)}
  .sug.down{border-left-color:var(--warn)}
  .mxd small{display:none}
  .mxd.lock, .mxd.lock b{color:var(--muted);font-weight:400}
  .mxd.lock b{text-decoration:line-through}
  .mxd.lock small{display:inline;font-size:inherit}
  .sug.drop{border-left-color:var(--bad)}
  .rx .badge + b,.rx b{white-space:nowrap}

  /* timer przerwy: ciemny pasek na całą szerokość nad dolnym menu, bursztynowe cyfry */
  #rest{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));          /* = wysokość menu: przerwa leży na menu */
       z-index:7;background:var(--panel);color:var(--light-white);
        padding:0 16px 8px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
  .rtop{display:grid;min-width:0}
  .rlbl{font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rtime{font:800 46px/1 var(--f-display);letter-spacing:.04em;color:var(--light-amber);font-variant-numeric:tabular-nums}
  .rbtns{display:flex;gap:6px}
  .rbtns button{min-height:44px;min-width:52px;border:1px solid var(--light-off);background:transparent;color:var(--light-white);border-radius:var(--r);
                font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:0 8px}
  .rbar{grid-column:1/-1;grid-row:1;height:8px;background:var(--light-off);margin:0 -16px 6px}          /* gruby pasek na górnej krawędzi */
  .rbar i{display:block;height:100%;background:var(--light-amber);width:100%}
  #rest.end .rtime{color:var(--light-red)}                                                              /* ostatnie 10 s */
  #rest.end .rbar i{background:var(--light-red)}
  body.resting main{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
  body.resting #toast{bottom:calc(170px + env(safe-area-inset-bottom,0px))}

  /* okno od dołu (kalkulator talerzy, później zamiana ćwiczenia i kamera) */
  /* Ekran powitalny (v80): przy pierwszym wejściu z linku od trenera, 3 kroki; ponownie z zakładki Trener (welOpen) */
  #wel{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
  .wl-top{background:var(--intro-bg);color:var(--intro-ink);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px;flex:none}
  .wl-top{min-height:calc(60px + env(safe-area-inset-top))}.wl-top img{width:24px;height:24px}
  .wl-top b{font:800 17px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
  .wl-skip{margin-left:auto;background:none;border:0;color:var(--intro-muted);min-height:44px;padding:0 4px;font-weight:600;font-size:15px}
  .wl-in{flex:1;width:100%;max-width:480px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
  .wl-dots{display:flex;gap:6px}.wl-dots i{height:5px;flex:1;border-radius:3px;background:var(--line)}.wl-dots i.on{background:var(--accent)}
  #wel h2:focus{outline:none}
  .wl-in h2{margin:4px 0 0;font:800 34px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink-2)}
  .wl-in .lead{margin:0;font-size:16px;color:var(--ink)}
  .wl-hero{width:84px;height:84px;border-radius:20px;display:block}
  .wl-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);box-shadow:var(--shadow);padding:6px 16px}
  .wl-list{list-style:none;margin:0;padding:0}
  .wl-list li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
  .wl-list li:first-child{border-top:0}
  .wl-list .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font:600 14px/1 var(--f-mono)}
  .wl-list .ic{flex:none;width:28px;height:28px;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px}
  .wl-list .ic svg{width:24px;height:24px}
  .wl-k{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-weight:600;white-space:nowrap}
  .wl-k svg{width:16px;height:16px}
  .wl-lt{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin:0 4px 0 2px}.wl-list .nw{white-space:nowrap}
  .wl-lt.g{background:var(--e-g)}.wl-lt.y{background:var(--e-y)}.wl-lt.r{background:var(--e-r)}
  .wl-note{margin:0;font-size:14px;color:var(--muted)}
  .wl-warn{background:var(--surface);border-radius:var(--r);box-shadow:inset 5px 0 0 var(--warn),var(--shadow);padding:10px 14px 10px 18px;font-size:15px}
  .wl-ok{background:var(--surface);border-radius:var(--r);box-shadow:inset 5px 0 0 var(--ok),var(--shadow);padding:10px 14px 10px 18px;font-size:15px}
  .wl-foot{margin-top:auto;display:grid;gap:8px;padding-top:6px}
  .wl-foot .btn{width:100%}
  .wl-again{width:100%;margin-top:var(--gap)}
  #sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--panel) 55%,transparent)}
  .sh-in{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-top:0;border-radius:22px 22px 0 0;
         padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-width:640px;margin:0 auto}
  .sh-in h2{margin:0;font:800 28px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink-2)}
  .sh-in .sub{margin:-6px 0 0}
  .fxe h3{font-size:15px;font-weight:600;margin:10px 0 6px}
  .fxi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
  .fxi img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:var(--r);background:var(--surface-2)}
  .fxk{margin:0 0 6px;padding-left:22px;display:grid;gap:6px;font-size:15px;line-height:1.4}
  .fxs{font-size:12px;color:var(--muted);margin:4px 0 10px}
  /* zmiany w jednostce trenera (flaga „edycja”) */
  .ed-q{text-align:left}
  .sh-in .ed-s{margin:0}
  .nu{border-bottom:1px solid var(--line)}
  .nu>button{display:grid;width:100%;align-items:baseline;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;min-height:56px;background:none;border:0;color:var(--ink);text-align:left;font:15px/1.3 var(--f-body);cursor:pointer}
  .nu b{font:700 16px var(--f-body)}.nu small{grid-column:1;color:var(--ink-2);font-size:13px}.nu .ch{grid-row:span 2;align-self:center;font:800 18px var(--f-display);color:var(--accent)}.nu .ch.eq{color:var(--ink-2)}
  .nu .ed-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 0 12px}.nu .ed-4 input{width:100%;min-width:0;font-size:20px}
  .ed-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .ed-3 input{width:100%;min-width:0}
  .ed-3 input:disabled{opacity:.55}
  .ed-k{display:grid;gap:8px;margin-top:10px}
  .ed-k .seg button{font-size:14px}
  .ed-ln{width:100%;margin-top:12px;text-align:left;justify-content:flex-start;padding:0 12px}
  .ed-rm{margin:10px 0 var(--gap);display:grid;gap:6px}
  .ed-rm .lbl{text-align:left}
  .ed-r{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
