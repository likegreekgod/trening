name: Wdrożenie Apps Script
# Po scaleniu zmian w apps-script/ do main: testy → clasp push → nowa wersja istniejącego wdrożenia (adres /exec bez zmian).
# Sekrety repozytorium (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON   zawartość ~/.clasprc.json po `clasp login` (konto właściciela arkusza)
#   SCRIPT_ID      Apps Script → Ustawienia projektu → Identyfikator skryptu
#   DEPLOYMENT_ID  Wdróż → Zarządzaj wdrożeniami → Identyfikator wdrożenia (AKfy…)
on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.github/workflows/apps-script.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-script
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:code
      - name: Konfiguracja clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON" && test -n "$SCRIPT_ID" || { echo "Brak sekretów CLASPRC_JSON / SCRIPT_ID"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json
          # sprawdzenie sekretu bez wypisywania wartości
          node -e '
            const fs = require("fs"), p = require("os").homedir() + "/.clasprc.json", t = fs.readFileSync(p, "utf8");
            let j; try { j = JSON.parse(t); } catch (e) {
              console.log("CLASPRC_JSON nie jest poprawnym JSON (" + t.length + " znaków, początek: " + JSON.stringify(t.slice(0, 2)) + ", koniec: " + JSON.stringify(t.slice(-2)) + "): " + e.message);
              process.exit(1); }
            const need = ["token.refresh_token", "token.access_token", "oauth2ClientSettings.clientId", "oauth2ClientSettings.clientSecret"];
            const miss = need.filter(k => !k.split(".").reduce((o, x) => o && o[x], j));
            if (miss.length) { console.log("CLASPRC_JSON: brak pól " + miss.join(", ") + "; są: " + Object.keys(j).join(", ")); process.exit(1); }
            console.log("CLASPRC_JSON OK");'
      - name: clasp push
        run: npx clasp push --force
      - name: clasp deploy (istniejące wdrożenie)
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          test -n "$DEPLOYMENT_ID" || { echo "Brak sekretu DEPLOYMENT_ID"; exit 1; }
          npx clasp deploy -i "$DEPLOYMENT_ID" -d "$(git log -1 --pretty=%s | cut -c1-90)"
      - name: Sprzątanie
        if: always()
        run: rm -f ~/.clasprc.json .clasp.json
