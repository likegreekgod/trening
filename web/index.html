<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Trening</title>
<meta name="theme-color" content="#0f1612" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#edf4f2" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Czcionki lokalne (OFL, web/fonts/), też offline przez sw.js. Zakresy: łaciński + rozszerzony (polskie znaki). */
  @font-face{font-family:"Big Shoulders Display";font-weight:100 900;font-display:swap;src:url(fonts/big-shoulders-display-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"Big Shoulders Display";font-weight:100 900;font-display:swap;src:url(fonts/big-shoulders-display-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"Instrument Sans";font-weight:400 700;font-display:swap;src:url(fonts/instrument-sans-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"Instrument Sans";font-weight:400 700;font-display:swap;src:url(fonts/instrument-sans-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  /* Tokeny Pomost (docs/ui-v2-spec.md, „Paleta”). Kolory tylko przez te zmienne. */
  :root{--bg:#edf4f2;--surface:#ffffff;--surface-2:#e1eae6;--line:#c9d4cf;
        --ink:#17221c;--ink-2:#31473a;--muted:#5f6649;--olive:#7c8363;
        --primary:#31473a;--on-primary:#ffffff;--accent:#a9542a;--on-accent:#ffffff;
        --ok:#296c45;--warn:#8f5d0e;--bad:#b5483b;
        --panel:#17221c;--light-off:#38443d;--light-white:#f7f7f2;--light-red:#e5392d;--light-amber:#f0b54f;
        --p25:#c8372d;--p20:#2a5ea8;--p15:#d9ad1f;--p10:#3f8a4a;--p5:#f4f4f0;
        --f-display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
        --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
        color-scheme:light}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1612;--surface:#18221c;--surface-2:#223029;--line:#2f3f36;
          --ink:#edf4f2;--ink-2:#cfdcd5;--muted:#a3ab86;
          --primary:#c5cfa9;--on-primary:#0f1612;--accent:#e0a34a;--on-accent:#0f1612;
          --ok:#62b07a;--warn:#e0a34a;--bad:#e3826b;
          --panel:#050806;--light-off:#26302a;color-scheme:dark}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* nagłówek: tytuł, synchronizacja, tygodnie i dni jako zakładki podkreślone akcentem */
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--ink-2);padding:10px 16px 0}
  h1{margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;
     font:800 26px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink-2)}
  #sync{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right}
  .row{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  #days{border-top:1px solid var(--line)}
  .chip{flex:0 0 auto;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);border-radius:0;
        padding:8px 12px 6px;min-height:44px;font:700 17px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
  .chip.on{color:var(--ink-2);border-bottom-color:var(--accent)}
  .chip.done::after{content:" ✓";color:var(--ok)}
  .chip small{display:block;font:500 12px/1.2 var(--f-mono);letter-spacing:0;text-transform:none}
  main{padding:4px 16px 32px;max-width:640px;margin:0 auto}
  .stitle{margin:12px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;
          font:600 12px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .stitle .clock{font:700 20px/1 var(--f-display);letter-spacing:.04em;color:var(--ink);text-transform:none}

  /* ćwiczenie = sekcja protokołu: linia 2 px nad nazwą, bez kart */
  .card{background:transparent;border:0;border-top:2px solid var(--ink-2);border-radius:0;padding:12px 0 16px;margin-top:18px}
  .card.k{border-top-color:var(--olive)}
  .ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .cn{font:700 25px/1.02 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink)}
  .badge{flex:0 0 auto;border-radius:2px;padding:3px 6px;font:600 12px/1.2 var(--f-mono);background:var(--surface-2);color:var(--muted)}
  .ch .badge{font:800 13px/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
  .badge.A{background:var(--primary);color:var(--on-primary)}
  .badge.B{background:transparent;border:1px solid var(--ink-2);color:var(--ink-2)}
  .badge.K{background:transparent;border:1px solid var(--olive);color:var(--muted)}
  .rx{margin:6px 0 4px;font-size:15px;color:var(--ink-2)}
  .rx b{font:500 16px var(--f-mono);color:var(--ink)}
  .note{font-size:14px;font-style:italic;color:var(--ink-2);margin:6px 0 8px;border-left:2px solid var(--olive);padding:2px 0 2px 10px}
  .hint{font-size:14px;color:var(--warn);margin:2px 0 6px}

  /* serie = wiersze tabeli */
  .sets{display:grid;gap:0;margin-top:8px}
  .set{display:grid;grid-template-columns:44px 1fr 1fr 64px 44px;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
  .set.vbt{grid-template-columns:44px 1fr 1fr 58px 58px 44px}
  .set.simple{grid-template-columns:44px 1fr 1fr 96px 44px}
  .set.set-head{border-bottom:1px solid var(--ink-2);padding:0 0 6px;margin-top:10px}
  .set .n{position:relative;min-height:44px;display:flex;align-items:center;justify-content:center;
          font:700 21px/1 var(--f-display);color:var(--ink)}
  input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:2px;padding:9px 8px;font-size:16px}
  .set input,.set select{height:44px;border:0;background:transparent;text-align:center;padding:0 2px;min-width:0;
                         font:700 23px/1 var(--f-display);letter-spacing:.01em}
  .set select{appearance:none;-webkit-appearance:none;font-size:20px;text-align-last:center}
  .set.simple select{font:600 15px var(--f-body)}
  .set input::placeholder{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:1}
  .set:not(.set-head) > .lbl{font-size:12px;letter-spacing:0;text-transform:none}
  .set input:focus,.set select:focus{background:var(--surface-2)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .lbl{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
  .ok{height:44px;border-radius:2px;border:2px solid var(--ink-2);background:transparent;color:var(--line);font:700 20px/1 var(--f-body);padding:0}
  .ok.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
  .ok.pend{background:var(--warn);border-color:var(--warn);color:var(--surface)}
  .set.k-w .n{color:var(--olive);font-size:17px}
  .set.k-w input{color:var(--muted)}
  .set.k-x .n{color:var(--ink-2)}
  .set.k-d .n{color:var(--accent);font-size:17px}
  .set.fail .rpe{color:var(--bad)}
  .set.fail .kg,.set.fail .reps{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
  .set.fail .ok.on{background:var(--bad);border-color:var(--bad)}
  /* ✕ przy ostatnim dodanym wierszu: cała komórka numeru to cel dotyku 44 px */
  .del{position:absolute;inset:0;border:0;background:transparent;color:var(--bad);padding:2px;
       display:flex;align-items:flex-end;justify-content:flex-end;font:700 12px/1 var(--f-body)}
  .del.arm{background:var(--bad);color:var(--surface);align-items:center;justify-content:center;border-radius:2px}

  .vid{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--ink-2);background:transparent;color:var(--ink-2);border-radius:2px;padding:10px 12px;min-height:44px;
       font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center}
  .btn.p{background:var(--primary);border-color:var(--primary);color:var(--on-primary);width:100%;padding:12px;
         font:800 22px/1 var(--f-display);letter-spacing:.06em}
  .tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .btn.sm{padding:8px 10px}
  .btn.sm.x{border-color:var(--accent);color:var(--accent)}
  .btn.sm.d{border-color:var(--accent);color:var(--accent);border-style:dashed}
  .btn.all{width:100%;margin-top:8px;border-color:var(--ok);color:var(--ok);border-width:2px}
  .bar{height:3px;background:var(--surface-2);flex:1 1 120px;overflow:hidden;display:none}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .vlinks a{color:var(--ink-2);font-size:14px;margin-right:10px;text-underline-offset:3px}

  /* podsumowanie jednostki */
  .sess .cn{margin-bottom:4px}
  .sess label{display:block;margin:14px 0 6px;font:600 12px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  details.opt{margin-top:14px;border-top:1px dashed var(--line);padding:4px 0}
  details.opt summary{font-size:15px;padding:10px 0;min-height:44px;color:var(--ink-2);cursor:pointer}
  details.opt label{margin-top:8px}
  details.help{border-top:2px solid var(--accent);padding:10px 0;margin-top:14px}
  details.help summary{font:700 20px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink-2);cursor:pointer;min-height:44px;display:flex;align-items:center}
  details.help ol{margin:8px 0 2px;padding-left:20px;font-size:14px}
  details.help li{margin-bottom:6px}
  .timebox{display:flex;align-items:baseline;gap:12px;background:var(--panel);color:var(--light-white);border-radius:0;padding:10px 12px}
  .timebox .clock{font:800 34px/1 var(--f-display);letter-spacing:.04em;color:var(--light-amber);font-variant-numeric:tabular-nums}
  .timebox small{color:var(--light-white);opacity:.8;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel);color:var(--light-white);
         border-left:4px solid var(--light-amber);padding:10px 16px;border-radius:0;font-size:15px;display:none;z-index:9;max-width:calc(100% - 32px)}
  .scale{display:grid;gap:4px;margin-top:4px}
  .scale.s5{grid-template-columns:repeat(5,1fr)}
  .scale.s11{grid-template-columns:repeat(6,1fr)}
  .pv{height:46px;border-radius:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 22px/1 var(--f-display)}
  .pv.on.n{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .pv.on.g{background:var(--ok);border-color:var(--ok);color:var(--surface)}
  .pv.on.a{background:var(--warn);border-color:var(--warn);color:var(--surface)}
  .pv.on.r{background:var(--bad);border-color:var(--bad);color:var(--surface)}
  .sub{font-size:13px;color:var(--muted);margin:-2px 0 4px}
  .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
  .pls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .pl{border:1px solid var(--ink-2);background:transparent;color:var(--ink-2);border-radius:2px;padding:9px 12px;min-height:44px;
      font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
  .pl.on{background:var(--ink-2);color:var(--bg)}
  .prow{margin-top:12px}
  .prow .plbl{font:700 18px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink-2)}
  .prow .plbl small{font:400 13px var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<header>
  <h1><span id="title">Trening</span><span id="sync">ładowanie…</span></h1>
  <div class="row" id="weeks"></div>
  <div class="row" id="days"></div>
</header>
<main id="main"><div class="empty">Ładowanie planu…</div></main>
<div id="toast"></div>

<script src="config.js"></script>
<script src="lib.js"></script>
<script>
/* ---------- konfiguracja: klucz z linku (?k=…) zapamiętany w telefonie; ustawienia klienta przychodzą z getData ---------- */
const API_URL = window.API_URL;                    // z config.js
const KEY = (() => {
  const k = new URLSearchParams(location.search).get('k');
  try { if (k) localStorage.setItem('key', k); return k || localStorage.getItem('key') || ''; } catch (e) { return k || ''; }
})();
let PAIN = false;      // Klienci F „bol” = TAK → kolano i bark zawsze zaznaczone
let SIMPLE = false;    // Klienci G „tryb” = PROSTY
let EXTRA_DEF = 0;     // Klienci H „dod_serie”; Plan „dod_serie” nadpisuje
function applyCfg(c){
  if (!c) return;
  PAIN = !!c.pain; SIMPLE = !!c.simple; EXTRA_DEF = Number(c.extra) || 0;
  $('#title').textContent = 'Trening · ' + c.name; document.title = 'Trening – ' + c.name;
}
let PLAN = [], LOGS = {}, SESS = {}, cur = {week: 1, day: null};
const RPE = ['', '5', '5.5', '6', '6.5', '7', '7.5', '8', '8.5', '9', '9.5', '10'];
// tryb prosty: słowa zamiast RPE; w arkuszu nadal zapisuje się liczba RPE
const EFFORT = [['', '–'], ['6', 'Lekko'], ['7.5', 'Średnio'], ['9', 'Ciężko'], ['10', 'Max']];
const $ = s => document.querySelector(s);
// czyste funkcje z lib.js (testy: tests/lib.test.js)
const { fmtKg, num, esc, blank, plural, effortVal, floor25, isNum, setKey, repsDefault, localDate } = window.TL;

/* ---------- kolejka offline ---------- */
const QK = 'q_' + KEY;
function qGet(){ try { return JSON.parse(localStorage.getItem(QK) || '[]'); } catch(e){ return []; } }
function qSet(q){ try { localStorage.setItem(QK, JSON.stringify(q)); } catch(e){} }
// API Apps Script: POST text/plain (bez preflight CORS) → {ok, result} | {ok:false, error}
function call(fn, ...args){
  return fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ fn, key: KEY, args }) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => { if (!j.ok) throw new Error(j.error || 'błąd serwera'); return j.result; });
}
function send(fn, payload){
  setSync('zapisywanie…');
  return call(fn, payload).then(r => { setSync('zapisano ✓'); return r; })
    .catch(err => { const q = qGet(); q.push({fn, payload}); qSet(q); setSync('offline – w kolejce (' + q.length + ')'); throw err; });
}
async function flush(){
  const q = qGet(); if (!q.length) return;
  const rest = [];
  for (const it of q) { try { await call(it.fn, it.payload); } catch(e) { rest.push(it); } }
  qSet(rest); setSync(rest.length ? 'offline – w kolejce (' + rest.length + ')' : 'zsynchronizowano ✓');
}
window.addEventListener('online', flush);
function setSync(t){ $('#sync').textContent = t; }
function toast(t){ const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 2500); }

/* ---------- czas jednostki: od pierwszego wpisu do „Zakończ” ---------- */
const TK = 't_' + KEY;
function tGet(){ try { return JSON.parse(localStorage.getItem(TK) || '{}'); } catch(e){ return {}; } }
function tSet(m){ try { localStorage.setItem(TK, JSON.stringify(m)); } catch(e){} }
const skey = () => cur.week + '|' + cur.day;
function curSess(){
  return SESS['local|' + skey()] || Object.values(SESS).find(x => String(x.id).endsWith('|' + skey())) || {};
}
function startOf(){
  const cand = [];
  const loc = tGet()[skey()]; if (loc) cand.push(loc);
  // awaryjnie: najwcześniejszy zapis serii z serwera (np. inny telefon / wyczyszczona przeglądarka)
  Object.values(LOGS).forEach(l => {
    const p = String(l.id).split('|');
    if (p[0] !== 'local' && p[1] === String(cur.week) && p[2] === String(cur.day) && l.zapisano) {
      const t = Date.parse(l.zapisano); if (!isNaN(t)) cand.push(t);
    }
  });
  return cand.length ? Math.min(...cand) : null;
}
function markStart(){
  if (!cur.day || curSess().id) return;           // jednostka już zamknięta – nie liczymy od nowa
  const m = tGet();
  if (!m[skey()]) { m[skey()] = Date.now(); tSet(m); tick(); }
}
function fmtDur(ms){
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
}
function clockText(){
  const s = curSess();
  if (s.id) return blank(s.czas_min) ? '–' : s.czas_min + ' min';
  const st = startOf();

    toast('Zapisano ' + todo.length + ' ' + plural(todo.length, 'serię', 'serie', 'serii') + '.');
  });
  // skopiuj kg / powt. / RPE z 1. serii do pozostałych niezaznaczonych serii roboczych i dodatkowych
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    const o = b.dataset.copy, src = rowOf(o, 1);
    let n = 0;
    rowsOf(o).filter(r => r.dataset.k === 'p' || r.dataset.k === 'x').forEach(r => {
      if (r === src || r.querySelector('.ok').classList.contains('on')) return;
      ['.kg', '.reps', '.rpe'].forEach(c => { if (src.querySelector(c) && r.querySelector(c)) r.querySelector(c).value = src.querySelector(c).value; });
      r.classList.toggle('fail', src.querySelector('.rpe').value === 'F');
      n++;
    });
    if (n) markStart();
    toast(n ? 'Uzupełniono ' + n + ' ' + plural(n, 'serię', 'serie', 'serii') + ' jak 1. seria.' : 'Brak serii do uzupełnienia.');
  });
  // + rozgrzewka (R1, R2…) przed seriami roboczymi
  document.querySelectorAll('[data-warm]').forEach(b => b.onclick = () => {
    const o = b.dataset.warm, ex = exOf(o), ws = rowsOf(o, 'w'), set = 'R' + (ws.length + 1);
    addRow(o, rowHtml(ex, set, 'w'), ws[ws.length - 1], rowOf(o, 1));
    const row = rowOf(o, set); bindRow(row, ex, s0); refreshDel(o); row.querySelector('.kg').focus();
  });
  // + seria dodatkowa (tylko gdy trener pozwolił: Klienci kol. H lub Plan kol. dod_serie)
  document.querySelectorAll('[data-extra]').forEach(b => b.onclick = () => {
    const o = b.dataset.extra, ex = exOf(o);
    const work = rowsOf(o).filter(r => r.dataset.k === 'p' || r.dataset.k === 'x'), last = work[work.length - 1];
    const set = ex.sets + rowsOf(o, 'x').length + 1;
    addRow(o, rowHtml(ex, set, 'x', { kg: num(last.querySelector('.kg').value), reps: num(last.querySelector('.reps').value) }), last);
    bindRow(rowOf(o, set), ex, s0); refreshDel(o);
  });
  // + drop set (D1, D2…) po ostatniej serii, ~80% ciężaru poprzedniej
  document.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
    const o = b.dataset.drop, ex = exOf(o), all = rowsOf(o).filter(r => r.dataset.k !== 'w'), last = all[all.length - 1];
    const set = 'D' + (rowsOf(o, 'd').length + 1);
    addRow(o, rowHtml(ex, set, 'd', dropDefault(ex, num(last.querySelector('.kg').value))), last);
    bindRow(rowOf(o, set), ex, s0); refreshDel(o);
  });
  // ✕ usuń: 1. dotknięcie = „usuń?”, 2. dotknięcie = usunięcie (także z Logu, jeśli było zapisane)
  $('#main').onclick = e => {
    if (sessClick(e)) return;
    const del = e.target.closest('.del'); if (!del) return;
    if (!del.classList.contains('arm')) { del.classList.add('arm'); del.textContent = 'usuń?'; setTimeout(() => { if (del.isConnected) { del.classList.remove('arm'); del.textContent = '✕'; } }, 3000); return; }
    const row = del.closest('.set'), o = row.dataset.o, ex = exOf(o), set = setKey(row.dataset.s);
    const saved = !!getLog(ex, set), suffix = lid(ex, set);
    Object.keys(LOGS).forEach(k => { if (k.endsWith(suffix)) delete LOGS[k]; });
    row.remove(); refreshDel(o);
    if (saved) send('deleteSet', { week: cur.week, day: cur.day, order: ex.order, set }).catch(() => {});
    toast('Usunięto serię ' + set + '.');
  };
  document.querySelectorAll('input[data-vo]').forEach(inp => inp.onchange = () => {
    const ex = exs.find(e => e.order === +inp.dataset.vo);
    if (inp.files[0]) { markStart(); uploadVideo(ex, s0, inp.files[0]); }
  });
  $('#saveSess').onclick = () => {
    const s = curSess(), k = skey();
    const pains = {};
    document.querySelectorAll('.pl.on').forEach(c => {
      const v = document.querySelector(`.prow[data-p="${c.dataset.p}"] .scale`).dataset.v;
      if (v !== '') pains[c.dataset.p] = +v;
    });
    const vals = Object.values(pains);
    const end = Date.now(), st = startOf();
    // jednostka już zapisana → zachowaj pierwotny czas; nowa → od pierwszego wpisu do teraz
    const minutes = s.id ? (blank(s.czas_min) ? '' : s.czas_min) : (st ? Math.max(1, Math.round((end - st) / 60000)) : '');
    const p = { week: cur.week, day: cur.day, date: s0.date, knee: pains.kolano ?? '', shoulder: pains.bark ?? '',
      pain: Object.entries(pains).map(([a, b]) => a + ':' + b).join('; '), painMax: vals.length ? Math.max(...vals) : '',
      feel: +$('#feel').dataset.v || 3,
      rpeSession: $('#srpe').dataset.v === '' ? '' : +$('#srpe').dataset.v, minutes, note: $('#snote').value,
      start: s.id ? (s.start || '') : (st ? new Date(st).toISOString() : ''),
      end: s.id ? (s.koniec || '') : new Date(end).toISOString() };
    SESS['local|' + k] = { id: 'local|' + k, bol_kolano: p.knee, bol_bark: p.shoulder, bol: p.pain, bol_max: p.painMax, rpe_sesji: p.rpeSession, samopoczucie: p.feel, czas_min: p.minutes,
      uwagi: p.note, start: p.start, koniec: p.end };
    const m = tGet(); delete m[k]; tSet(m);
    const msg = s.id ? 'Zmiany zapisane.' : (SIMPLE ? 'Trening' : 'Jednostka') + ' zapisan' + (SIMPLE ? 'y' : 'a') + (minutes ? ' (' + minutes + ' min)' : '') + '. Dobra robota!';
    send('logSession', p).then(() => { toast(msg); render(); }).catch(() => { toast('Brak sieci – zapiszę, gdy wróci połączenie.'); render(); });
  };
}
// start zegara przy pierwszym wpisie w serii lub uwagach
$('#main').addEventListener('input', e => { if (e.target.closest('.set') || e.target.id === 'snote') markStart(); });
$('#main').addEventListener('change', e => { if (e.target.closest('.set')) markStart(); });

/* ---------- film: wgrywanie w kawałkach do Google Drive ---------- */
function readB64(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
}
function directPut(url, file, onProg){
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.upload.onprogress = e => { if (e.lengthComputable) onProg(e.loaded / e.total); };
    x.onload = () => {
      if (x.status === 200 || x.status === 201) {
        try { const f = JSON.parse(x.responseText); res({ id: f.id, link: f.webViewLink || ('https://drive.google.com/file/d/' + f.id + '/view') }); }
        catch (e) { rej(new Error('odpowiedź Drive nieczytelna')); }
      } else rej(new Error('Drive ' + x.status));
    };
    x.onerror = () => rej(new Error('direct-blocked'));
    x.send(file);
  });
}
async function relayUpload(meta, file, onProg){
  const init = await call('startUpload', meta);
  let start = 0, out = null;
  while (start < file.size) {
    const end = Math.min(start + init.chunk, file.size);
    const b64 = await readB64(file.slice(start, end));
    out = await call('uploadChunk', init.uploadId, b64, start, file.size);
    start = end; onProg(start / file.size);
  }
  return out;
}
async function uploadVideo(ex, s0, file){
  // film przypisany do ostatniej zaznaczonej serii (roboczej/dodatkowej); brak → seria 1
  const doneBtns = document.querySelectorAll(`.set[data-o="${ex.order}"]:not([data-k="w"]) .ok.on`);
  const set = doneBtns.length ? setKey(doneBtns[doneBtns.length - 1].closest('.set').dataset.s) : 1;
  const bar = $('#bar' + ex.order), fill = bar.querySelector('i');
  const prog = f => fill.style.width = Math.max(2, Math.round(100 * f)) + '%';
  bar.style.display = 'block'; prog(0); setSync('wgrywanie filmu…');
  const meta = { date: s0.date, day: cur.day, name: ex.name, set, fileName: file.name, mimeType: file.type || 'video/mp4', size: file.size };
  const t0 = Date.now();
  try {
    let out, mode = 'bezpośrednio';
    try {
      const init = await call('startUpload', Object.assign({ origin: location.origin }, meta));
      if (!init.url) throw new Error('direct-blocked');
      out = await directPut(init.url, file, prog);
    } catch (e) {
      if (e.message !== 'direct-blocked') throw e;
      mode = 'przez serwer'; prog(0);
      out = await relayUpload(meta, file, prog);
    }
    const prev = getLog(ex, set) || {};
    const row = document.querySelector(`.set[data-o="${ex.order}"][data-s="${set}"]`);
    const p = { week: cur.week, day: cur.day, date: s0.date, order: ex.order, name: ex.name, set,
      kg: num(row.querySelector('.kg').value), reps: num(row.querySelector('.reps').value), rpe: row.querySelector('.rpe').value === 'F' ? '' : row.querySelector('.rpe').value, typ: prev.typ || '',
      vbt: row.querySelector('.vbt') ? num(row.querySelector('.vbt').value) : '', done: prev.wykonane === 'TAK', video: out.link,
      note: 'film ' + mode + ', ' + Math.round(file.size / 1048576) + ' MB, ' + Math.round((Date.now() - t0) / 1000) + ' s' };
    LOGS['local' + lid(ex, set)] = Object.assign({}, prev, { id: 'local' + lid(ex, set), film_link: out.link });
    await send('logSet', p);
    toast('Film wgrany ' + mode + ' (seria ' + set + ')'); render();
  } catch (e) {
    toast('Błąd wgrywania: ' + e.message); setSync('błąd filmu'); bar.style.display = 'none';
  }
}
