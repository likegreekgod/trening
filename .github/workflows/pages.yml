name: Publikacja na GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # dwa zadania jak we wzorcu GitHuba: deploy-pages w tym samym zadaniu co wysyłka paczki
  # czasem nie widzi jej jeszcze („No artifacts named github-pages”, 25.11.2026)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Wersja aplikacji (VERSION w sw.js)
        run: |
          grep -q "^const VERSION = 'dev';" web/sw.js || { echo "web/sw.js: brak const VERSION = 'dev';"; exit 1; }
          sed -i "s/^const VERSION = 'dev';/const VERSION = 'v${{ github.run_number }}-${GITHUB_SHA::7}';/" web/sw.js
          grep "^const VERSION" web/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
